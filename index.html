<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶可夢交換管理系統 v6.14 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); background-attachment: fixed; min-height: 100vh; overscroll-behavior-y: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        button,
        a,
        input,
        select,
        textarea {
            touch-action: manipulation;
        }
        @media (max-width: 767px) {
            input,
            select,
            textarea {
                font-size: 16px !important;
            }
        }
        .date-card { transition: all 0.3s ease; min-width: 200px; }
        @media (max-width: 640px) { .date-card { min-width: 160px; } }
        
        /* 🔥 iPad 終極剋星：徹底封殺長按「拷貝/反白」選單 */
        .drag-item, .drag-item span, .drag-item div, .done-item, .done-item span, .done-item div { 
            -webkit-touch-callout: none !important; /* 禁用 iOS 長按彈出選單 */
            -webkit-user-select: none !important;   /* 禁用 Safari 文字反白 */
            user-select: none !important;           /* 禁用一般文字反白 */
        }
        .drag-item { touch-action: pan-y; cursor: grab; }
        .drag-item:active { cursor: grabbing; }
        
        .sortable-ghost { opacity: 0.4; background-color: #ffedd5; border: 2px dashed #f97316; }
    </style>
</head>
<body class="p-3 md:p-8 font-sans text-gray-900">
    <div class="max-w-5xl mx-auto space-y-4 md:space-y-6">
        
        <div class="text-center py-2 md:py-4">
            <h1 class="text-2xl md:text-3xl font-extrabold text-white drop-shadow-md tracking-widest uppercase">Pokémon Trade Manager</h1>
            <p class="text-blue-100 text-xs md:text-sm mt-1 opacity-80 mb-3">一帳號一天僅限一次交換 (提早完成自動遞補版 v6.14)</p>
            <div class="flex justify-center items-center gap-2 flex-wrap">
                <button id="copyCostumeFilterBtn" type="button" class="min-w-[84px] px-5 py-2 rounded-full bg-orange-500 text-white font-bold text-sm shadow-lg hover:bg-orange-600 active:scale-95 transition-all">裝扮</button>
                <button id="copyBackgroundFilterBtn" type="button" class="min-w-[84px] px-5 py-2 rounded-full bg-pink-500 text-white font-bold text-sm shadow-lg hover:bg-pink-600 active:scale-95 transition-all">背卡</button>
            </div>
            <div class="mt-3 flex flex-wrap justify-center gap-2">
                <button id="openAccountManagementBtn" type="button" class="min-h-11 rounded-xl bg-green-600 px-3 py-2 text-sm font-bold text-white shadow-md transition-all hover:bg-green-700 active:scale-95">👤 帳號管理</button>
                <button id="openScheduleOverviewBtn" type="button" class="min-h-11 rounded-xl bg-orange-500 px-3 py-2 text-sm font-bold text-white shadow-md transition-all hover:bg-orange-600 active:scale-95">📅 待交換清單</button>
                <button id="openLuckyTrinketStatusBtn" type="button" class="min-h-11 rounded-xl bg-purple-600 px-3 py-2 text-sm font-bold text-white shadow-md transition-all hover:bg-purple-700 active:scale-95">💎 亮晶晶首飾</button>
            </div>
        </div>

        <div class="glass-panel p-5 md:p-6 rounded-3xl shadow-2xl">
            <div class="flex items-center gap-2 mb-4">
                <div class="w-2 h-6 bg-blue-500 rounded-full"></div>
                <h2 class="text-lg md:text-xl font-bold text-gray-800">新增庫存</h2>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-12 gap-3 md:gap-4 p-3 md:p-4 bg-white/50 rounded-2xl border border-white/50">
                <div class="col-span-2 md:col-span-3 space-y-1">
                    <label class="block text-[10px] md:text-xs font-bold text-blue-600 ml-1 uppercase">選擇帳號</label>
                    <select id="accountSelect" class="border-0 bg-white p-2.5 rounded-xl w-full shadow-sm text-sm">
                        <option value="">-- 選擇帳號 --</option>
                    </select>
                </div>
                <div class="space-y-1 md:col-span-2">
                    <label class="block text-[10px] md:text-xs font-bold text-blue-600 ml-1 uppercase">背卡</label>
                    <select id="backCardSelect" class="border-0 bg-white p-2.5 rounded-xl w-full shadow-sm text-sm">
                        <option value="none" selected>無</option>
                        <option value="special">特別背卡</option>
                        <option value="commemorative">紀念背卡</option>
                        <option value="costume">裝扮</option>
                    </select>
                </div>
                <div class="space-y-1 md:col-span-2">
                    <label class="block text-[10px] md:text-xs font-bold text-blue-600 ml-1 uppercase">色違</label>
                    <select id="colorTypeSelect" class="border-0 bg-white p-2.5 rounded-xl w-full shadow-sm text-sm">
                        <option value="normal">普色</option>
                        <option value="shiny" selected>異色</option>
                    </select>
                </div>
                <div class="col-span-2 md:col-span-3 space-y-1">
                    <label class="block text-[10px] md:text-xs font-bold text-blue-600 ml-1 uppercase">寶可夢名稱</label>
                    <input type="text" id="pokemonInput" placeholder="輸入寶可夢名稱" class="border-0 bg-white p-2.5 rounded-xl w-full shadow-sm text-sm">
                </div>
                <div class="space-y-1 md:col-span-1">
                    <label class="block text-[10px] md:text-xs font-bold text-blue-600 ml-1 uppercase">數量</label>
                    <input type="number" id="quantityInput" min="1" value="1" class="border-0 bg-white p-2.5 rounded-xl w-full text-center shadow-sm text-sm font-bold">
                </div>
                <div class="flex items-end md:col-span-1">
                    <button id="addPokemonBtn" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl w-full hover:bg-blue-700 transition-all font-bold shadow-lg active:scale-95 text-sm">新增</button>
                </div>
            </div>
        </div>

        <div class="glass-panel p-5 md:p-6 rounded-3xl shadow-2xl">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b border-gray-200 pb-4">
                <div class="flex flex-wrap gap-2">
                    <button class="tab-btn px-4 md:px-6 py-2 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-md" data-tab="stock">在庫</button>
                    <button class="tab-btn px-4 md:px-6 py-2 rounded-xl text-gray-500 font-bold text-sm" data-tab="trading">待交換</button>
                    <button class="tab-btn px-4 md:px-6 py-2 rounded-xl text-gray-500 font-bold text-sm" data-tab="done">已完成</button>
                    <button class="tab-btn px-4 md:px-6 py-2 rounded-xl text-gray-500 font-bold text-sm" data-tab="all">全部</button>
                    <button id="generateCopyBtn" class="px-4 md:px-6 py-2 rounded-xl bg-purple-600 text-white font-bold text-sm shadow-md hover:bg-purple-700 active:scale-95 transition-all">📝 現貨文案</button>
                </div>
                <div class="w-full md:w-auto flex flex-wrap items-center gap-2">
                    <select id="doneSortSelect" class="hidden shrink-0 bg-white border border-gray-200 px-3 py-2 rounded-xl text-sm font-bold shadow-sm outline-none">
                        <option value="desc">由近到遠</option>
                        <option value="asc">由遠到近</option>
                    </select>
                    <div class="relative flex-1 min-w-0 md:flex-none">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔍</span>
                        <input type="text" id="searchInput" placeholder="搜尋寶可夢名稱..." class="w-full md:w-56 pl-9 pr-8 py-2 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold shadow-sm transition-all">
                        <button id="clearSearchBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 hover:text-gray-500 hidden text-lg font-black leading-none focus:outline-none">&times;</button>
                    </div>
                </div>
            </div>
            <div id="pokemonList" class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4"></div>
        </div>
    </div>

    <div id="accountManagementModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-3 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="accountManagementModalTitle">
        <div class="max-h-[90vh] w-full max-w-2xl overflow-y-auto rounded-3xl bg-white p-4 shadow-2xl md:p-6">
            <h2 id="accountManagementModalTitle" class="text-xl font-black text-gray-800">👤 帳號管理</h2>
            <div class="mt-4 flex flex-col gap-4">
                <div class="flex w-full items-center gap-3">
                    <input type="text" id="newAccountInput" placeholder="輸入帳號" class="min-w-0 flex-1 rounded-xl border border-gray-200 bg-white p-3 text-sm shadow-sm outline-none focus:ring-2 focus:ring-green-400">
                    <button id="saveAccountBtn" class="min-h-11 shrink-0 rounded-xl bg-green-600 px-4 py-2 text-sm font-bold text-white shadow-md transition-all hover:bg-green-700 active:scale-95">保存</button>
                </div>
                <div id="accountTags" class="flex flex-wrap gap-2"></div>
            </div>
            <button id="closeAccountManagementModalBtn" type="button" class="mt-5 min-h-11 w-full rounded-2xl bg-gray-100 px-4 py-2 text-sm font-bold text-gray-600 hover:bg-gray-200">關閉</button>
        </div>
    </div>

    <div id="scheduleOverviewModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-3 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="scheduleOverviewModalTitle">
        <div class="max-h-[90vh] w-full max-w-5xl overflow-y-auto rounded-3xl bg-white p-4 shadow-2xl md:p-6">
            <h2 id="scheduleOverviewModalTitle" class="text-xl font-black text-gray-800">📅 待交換清單</h2>
            <p class="mt-1 text-sm font-bold text-gray-500">僅顯示當日與未來，已完成自動隱藏</p>
            <div id="scheduleTimeline" class="mt-4 flex gap-3 overflow-x-auto pb-4 md:gap-4"></div>
            <button id="closeScheduleOverviewModalBtn" type="button" class="mt-2 min-h-11 w-full rounded-2xl bg-gray-100 px-4 py-2 text-sm font-bold text-gray-600 hover:bg-gray-200">關閉</button>
        </div>
    </div>

    <div id="luckyTrinketStatusModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-3 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="luckyTrinketStatusTitle">
        <div class="max-h-[90vh] w-full max-w-2xl overflow-y-auto rounded-3xl bg-white p-4 shadow-2xl md:p-6">
            <div class="glass-panel overflow-hidden rounded-2xl shadow-xl" aria-labelledby="luckyTrinketStatusTitle">
                <h2 id="luckyTrinketStatusTitle" class="px-4 pt-4 text-xl font-black text-gray-800">💎 亮晶晶首飾</h2>
                <p id="luckyTrinketCycleSubtitle" class="px-4 pb-2 text-xs font-bold text-gray-500"></p>
                <table class="w-full table-fixed text-left text-sm">
                    <thead class="border-b border-gray-200 text-gray-500">
                        <tr>
                            <th scope="col" class="w-2/3 px-4 py-3 font-bold">帳號</th>
                            <th scope="col" class="w-1/3 px-4 py-3 font-bold">首飾狀態</th>
                        </tr>
                    </thead>
                    <tbody id="luckyTrinketAccountList" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
            <button id="closeLuckyTrinketStatusBtn" type="button" class="mt-5 min-h-11 w-full rounded-2xl bg-gray-100 px-4 py-2 text-sm font-bold text-gray-600 hover:bg-gray-200">關閉</button>
        </div>
    </div>

    <div id="tradeModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-[300px] text-center">
            <h2 class="text-xl font-black text-gray-800 tracking-tight">安排交換</h2>
            <p id="targetAccLabel" class="text-blue-500 text-sm font-bold mt-1"></p>
            <input type="text" id="partnerInput" placeholder="買家名稱" class="border border-gray-200 p-3 rounded-2xl w-full mt-4 text-center focus:ring-2 focus:ring-orange-400 outline-none font-bold text-base">
            <div class="grid grid-cols-1 gap-2 mt-3">
                <button id="luckyTrinketBuyerBtn" type="button" aria-pressed="false" class="min-h-11 rounded-2xl border border-gray-300 bg-white px-3 py-2 text-sm font-bold text-gray-500">亮晶晶首飾（他出）</button>
                <button id="luckyTrinketSellerBtn" type="button" aria-pressed="false" aria-describedby="tradeLuckyTrinketMessage" class="min-h-11 rounded-2xl border border-gray-300 bg-white px-3 py-2 text-sm font-bold text-gray-500 disabled:cursor-not-allowed disabled:border-gray-200 disabled:bg-gray-100 disabled:text-gray-400 disabled:opacity-60">亮晶晶首飾（我出）</button>
            </div>
            <p id="tradeLuckyTrinketMessage" aria-live="polite" class="mt-2 text-xs font-bold text-gray-500"></p>
            <div class="flex gap-2 mt-5">
                <button id="cancelTradeBtn" type="button" class="min-h-11 flex-1 py-2 text-gray-400 font-bold text-sm">取消</button>
                <button id="confirmTradeBtn" type="button" class="min-h-11 flex-[2] bg-orange-500 text-white py-2 rounded-2xl font-bold hover:bg-orange-600 active:scale-95 shadow-md text-sm transition-all">確認排隊</button>
            </div>
        </div>
    </div>

    <div id="editStockModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-5 md:p-6 rounded-3xl shadow-2xl w-full max-w-[360px]" role="dialog" aria-modal="true" aria-labelledby="editStockModalTitle">
            <h2 id="editStockModalTitle" class="text-xl font-black text-gray-800 tracking-tight text-center">編輯現貨</h2>
            <div class="mt-4 space-y-3">
                <div>
                    <label for="editStockAccountSelect" class="block mb-1 text-xs font-bold text-blue-600">帳號</label>
                    <select id="editStockAccountSelect" class="border border-gray-200 bg-white p-3 rounded-xl w-full text-base"></select>
                </div>
                <div>
                    <label for="editStockPokemonInput" class="block mb-1 text-xs font-bold text-blue-600">寶可夢名稱</label>
                    <input type="text" id="editStockPokemonInput" class="border border-gray-200 bg-white p-3 rounded-xl w-full text-base">
                </div>
                <div>
                    <label for="editStockColorTypeSelect" class="block mb-1 text-xs font-bold text-blue-600">色違</label>
                    <select id="editStockColorTypeSelect" class="border border-gray-200 bg-white p-3 rounded-xl w-full text-base">
                        <option value="normal">普色</option>
                        <option value="shiny">異色</option>
                    </select>
                </div>
                <div>
                    <label for="editStockBackCardSelect" class="block mb-1 text-xs font-bold text-blue-600">背卡</label>
                    <select id="editStockBackCardSelect" class="border border-gray-200 bg-white p-3 rounded-xl w-full text-base">
                        <option value="none">無</option>
                        <option value="special">特別背卡</option>
                        <option value="commemorative">紀念背卡</option>
                        <option value="costume">裝扮</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2 mt-5">
                <button id="cancelEditStockBtn" type="button" class="min-h-11 flex-1 py-2 text-gray-400 font-bold text-sm">取消</button>
                <button id="saveEditStockBtn" type="button" class="min-h-11 flex-[2] bg-blue-600 text-white py-2 rounded-2xl font-bold hover:bg-blue-700 active:scale-95 shadow-md text-sm transition-all">儲存修改</button>
            </div>
        </div>
    </div>

    <div id="editTradeModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-[320px] text-center" role="dialog" aria-modal="true" aria-labelledby="editTradeModalTitle">
            <h2 id="editTradeModalTitle" class="text-xl font-black text-gray-800 tracking-tight">編輯交換</h2>
            <p id="editTradeAccountLabel" class="text-blue-500 text-sm font-bold mt-1"></p>
            <p id="editTradePokemonLabel" class="text-gray-700 text-sm font-black mt-1"></p>
            <input type="text" id="editTradePartnerInput" placeholder="買家名稱" class="border border-gray-200 p-3 rounded-2xl w-full mt-4 text-center focus:ring-2 focus:ring-orange-400 outline-none font-bold text-base">
            <div class="grid grid-cols-1 gap-2 mt-3">
                <button id="editLuckyTrinketBuyerBtn" type="button" aria-pressed="false" class="min-h-11 rounded-2xl border border-gray-300 bg-white px-3 py-2 text-sm font-bold text-gray-500">亮晶晶首飾（他出）</button>
                <button id="editLuckyTrinketSellerBtn" type="button" aria-pressed="false" class="min-h-11 rounded-2xl border border-gray-300 bg-white px-3 py-2 text-sm font-bold text-gray-500">亮晶晶首飾（我出）</button>
            </div>
            <div class="flex gap-2 mt-5">
                <button id="cancelEditTradeBtn" type="button" class="min-h-11 flex-1 py-2 text-gray-400 font-bold text-sm">取消</button>
                <button id="saveEditTradeBtn" type="button" class="min-h-11 flex-[2] bg-orange-500 text-white py-2 rounded-2xl font-bold active:scale-95 shadow-md text-sm transition-all">儲存修改</button>
            </div>
        </div>
    </div>

    <div id="completeModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[60] p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-[320px] text-center" role="dialog" aria-modal="true" aria-labelledby="completeModalTitle">
            <h2 id="completeModalTitle" class="text-xl font-black text-gray-800 tracking-tight">確認完成交換</h2>
            <div class="mt-4 rounded-2xl bg-gray-50 px-4 py-3 text-left text-sm font-bold leading-relaxed">
                <p class="text-gray-500">寶可夢：<span id="completePokemonName" class="text-gray-800"></span></p>
                <p class="mt-1 text-gray-500">買家：<span id="completePartnerName" class="text-gray-800"></span></p>
            </div>
            <p class="mt-4 text-sm font-bold leading-relaxed text-gray-600">確定這筆交換已經完成嗎？</p>
            <div class="flex gap-2 mt-5">
                <button id="cancelCompleteBtn" type="button" class="min-h-11 flex-1 py-2 text-gray-400 font-bold text-sm disabled:opacity-50 disabled:cursor-not-allowed">取消</button>
                <button id="confirmCompleteBtn" type="button" class="min-h-11 flex-[2] bg-green-600 text-white py-2 rounded-2xl font-bold hover:bg-green-700 active:scale-95 shadow-md text-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed">確認完成</button>
            </div>
        </div>
    </div>

    <div id="singleStockPriceModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-[320px] max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="singleStockPriceModalTitle">
            <h2 id="singleStockPriceModalTitle" class="text-xl font-black text-gray-800 tracking-tight text-center">💰 修改價格</h2>
            <div class="mt-4 rounded-2xl bg-gray-50 px-4 py-3 text-sm font-bold leading-relaxed">
                <p class="text-gray-500">帳號：<span id="singleStockPriceAccount" class="text-gray-800"></span></p>
                <p class="mt-1 text-gray-500">商品：<span id="singleStockPriceProduct" class="text-gray-800"></span></p>
            </div>
            <label for="singleStockPriceInput" class="mt-4 block text-sm font-bold text-gray-700">價格</label>
            <input id="singleStockPriceInput" type="text" inputmode="numeric" autocomplete="off" class="mt-2 w-full rounded-2xl border border-gray-200 p-3 text-center text-base font-bold outline-none focus:ring-2 focus:ring-emerald-400">
            <p id="singleStockPriceMessage" class="min-h-5 mt-2 text-sm font-bold text-red-600" role="alert" aria-live="polite"></p>
            <div class="flex gap-2 mt-3">
                <button id="cancelSingleStockPriceBtn" type="button" class="min-h-11 flex-1 py-2 text-gray-400 font-bold text-sm">取消</button>
                <button id="saveSingleStockPriceBtn" type="button" class="min-h-11 flex-[2] bg-emerald-600 text-white py-2 rounded-2xl font-bold active:scale-95 shadow-md text-sm transition-all disabled:opacity-50">儲存價格</button>
            </div>
        </div>
    </div>

    <div id="copyModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-[400px] max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-black text-gray-800 tracking-tight text-center">📝 現貨文案</h2>
            <p id="copyStockCount" class="mt-1 text-center text-sm font-bold text-purple-600">總庫存：0 隻</p>
            <div id="copyNoticeBox" class="my-4 rounded-2xl border border-orange-200 bg-orange-50 p-4 text-sm leading-relaxed">
                <p class="font-bold text-orange-900">出售一些色違裝扮,背卡寶可夢</p>
                <p class="mt-3 font-bold text-orange-600">⚠️ 注意事項</p>
                <p class="mt-1 font-bold text-fuchsia-600">✨ 首飾 +200</p>
                <p class="font-bold text-fuchsia-600">✨ 亮晶晶寶可夢 +50</p>
                <p class="mt-2 text-gray-700">付款方式 ✅Linepay ✅8591實收</p>
            </div>
            <p id="copyPriceSummary" class="mb-2 text-sm font-bold text-gray-700"></p>
            <div id="copyPriceTargets" class="mb-3 max-h-36 overflow-y-auto whitespace-pre-line rounded-xl bg-purple-50 p-3 text-sm leading-relaxed text-gray-700"></div>
            <div id="copyPriceEditor">
            <textarea id="copyPriceInput" rows="3" inputmode="numeric" placeholder="例如：450 350 400" class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-400 outline-none text-sm resize-none text-gray-700"></textarea>
            <div class="flex gap-2 mt-2 mb-1">

            if (!Number.isFinite(value)) return '';

            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function isLegacySellerRecordRelevantToCycle(item, cycle) {
            if (!cycle || cycle.id !== LEGACY_LUCKY_TRINKET_ROLLOUT_CYCLE_ID || normalizeLuckyTrinket(item?.luckyTrinket) !== 'seller' || item?.luckyTrinketCycleId) return false;
            if (item.status === 'stock') return !item.tradeDate || (item.tradeDate >= cycle.startDate && item.tradeDate <= cycle.endDate);
            const tradeDateRelevant = item.tradeDate >= cycle.startDate && item.tradeDate <= cycle.endDate;
            if (item.status === 'trading') return tradeDateRelevant;
            if (item.status === 'done') {
                const completedDate = timestampToLocalDate(item.completedAt);
                return tradeDateRelevant || (completedDate >= cycle.startDate && completedDate <= cycle.endDate);
            }
            return false;
        }

            return !inventoryItems.some(item => item?.account === accountName && normalizeLuckyTrinket(item?.luckyTrinket) === 'seller' && (
                item.luckyTrinketCycleId === cycle.id || isLegacySellerRecordRelevantToCycle(item, cycle)
            ));

        function getLuckyTrinketAccountRows(accounts, inventoryItems, cycle = getLuckyTrinketCycleForDate(getTodayStr()), lockMap = luckyTrinketCycleLockMap) {
            const seenNames = new Set();

                rows.push({ account: name, hasTrinket });

            return [
                ...rows.filter(row => !row.hasTrinket),
                ...rows.filter(row => row.hasTrinket)
            ];

        function getCompletedAtMs(item) {

            const backCardLabels = { none: '', special: '特別背卡', commemorative: '紀念背卡', costume: '裝扮' };

        }

        function getInventoryGroupingKey(item) {
            return JSON.stringify([
                String(item?.account || ''),
                normalizeColorType(item?.colorType),
                normalizeBackCardType(item?.backCardType),
                item?.name || ''
            ]);
        }

        function getStockInventoryCount(items) {
            return items.filter(item => item.status === 'stock').length;

        function parseCopyPrices(text) {
            const trimmed = text.trim();
            if (!trimmed || !/^[\d\s,]+$/.test(trimmed)) return null;
            const prices = trimmed.split(/[\s,]+/);
            return prices.every(price => /^[1-9]\d*$/.test(price)) ? prices.map(Number) : null;
        }

        function isValidStockCopyPrice(value) {
            return Number.isInteger(value) && value > 0;
        }

        function parseSingleStockPrice(text) {
            const value = String(text ?? '').trim();
            if (!/^[1-9]\d*$/.test(value)) return null;
            const price = Number(value);
            return isValidStockCopyPrice(price) ? price : null;
        }

        function getStockItemSavedPrice(item, priceMap) {
            const priceKey = getInventoryGroupingKey(item);
            const price = priceMap.get(priceKey);
            return isValidStockCopyPrice(price) ? price : undefined;
        }

        function getStockItemPriceLabel(item, priceMap) {
            const price = getStockItemSavedPrice(item, priceMap);
            return price === undefined ? '💰 未設定價格' : `💰 ${price}元`;
        }

        function getSavedCopyPrices(groups, priceMap) {
            return groups.map(group => {
                const price = priceMap.get(group.priceKey);
                return isValidStockCopyPrice(price) ? price : undefined;
            });
        }

        function getMissingCopyPriceTargets(groups, priceMap) {
            return groups.filter(group => !isValidStockCopyPrice(priceMap.get(group.priceKey)));
        }

        function getCopyPriceBatchResult(targets, text, requireExactCount = false) {
            if (!text.trim()) return { ok: false, message: '請至少輸入 1 個價格' };
            const prices = parseCopyPrices(text);
            if (!prices) return { ok: false, message: '價格格式錯誤，請輸入正整數並以空格、逗號或換行分隔' };
            if (requireExactCount && prices.length !== targets.length) {
                return { ok: false, message: `需要 ${targets.length} 個價格，目前${prices.length < targets.length ? '只有' : '有'} ${prices.length} 個` };
            }
            if (prices.length > targets.length) {
                return { ok: false, message: `尚未設定價格只有 ${targets.length} 項，目前輸入 ${prices.length} 個` };
            }
            return { ok: true, entries: targets.slice(0, prices.length).map((group, index) => ({ group, price: prices[index] })) };
        }

        function getAllCopyPriceEditState(groups, priceMap) {
            return { targets: groups, prefill: getSavedCopyPrices(groups, priceMap).map(price => price || '').join('\n') };
        }

        function getStockCopyDisplayGroups(groups) {
            const sections = new Map();
            groups.forEach(group => {
                if (!sections.has(group.account)) sections.set(group.account, []);
                sections.get(group.account).push(group);
            });
            return Array.from(sections.values()).flat();
        }

        function buildStockCopyLines(groups, prices = null, inventoryItems = []) {
            if (!groups.length) return '目前無現貨寶可夢。';

            const hasAccountSections = groups.every(group =>
                Object.prototype.hasOwnProperty.call(group, 'account')
            );

            if (!hasAccountSections) {
                return groups.map(({ label, quantity }, index) => {
                    const stockLabel = quantity === 1 ? label : `${label}（現貨${quantity}隻）`;
                    const price = prices?.[index];
                    const priceLabel = Number.isInteger(price) && price > 0 ? `｜1隻${price}元` : '';
                    return `🔥 ${stockLabel}${priceLabel}`;
                }).join('\n');
            }

            const sections = new Map();
            groups.forEach(group => {
                const account = String(group.account || '');
                if (!sections.has(account)) sections.set(account, []);
                sections.get(account).push(group);
            });

            let priceIndex = 0;
            return Array.from(sections, ([account, accountGroups]) => {
                const lines = accountGroups.map(({ label, quantity }) => {
                    const stockLabel = quantity === 1 ? label : `${label}（現貨${quantity}隻）`;
                    const price = prices?.[priceIndex];
                    const priceLabel = Number.isInteger(price) && price > 0 ? `｜1隻${price}元` : '';
                    priceIndex += 1;
                    return `🔥 ${stockLabel}${priceLabel}`;
                });
                return `${buildStockCopyAccountHeader(account, inventoryItems)}\n${lines.join('\n')}`;
            }).join('\n\n');
        }

        function getStockCopyPreamble() {
            return [
                '出售一些色違裝扮,背卡寶可夢',
                '',
                '⚠️ 注意事項',
                '✨ 首飾 +200',
                '✨ 亮晶晶寶可夢 +50',
                '付款方式 ✅Linepay ✅8591實收'
            ].join('\n');
        }

        function buildFullStockCopyText(bodyText) {
            const preamble = getStockCopyPreamble();
            let body = String(bodyText ?? '').replace(/\r\n/g, '\n').trim();
            if (body.startsWith(preamble)) body = body.slice(preamble.length).trim();
            return body ? `${preamble}\n\n${body}` : preamble;
        }

        function getCopyPriceResult(groups, text, inventoryItems = []) {
            if (!groups.length) return { ok: false, message: '目前沒有現貨文案可套用價格' };
            const prices = parseCopyPrices(text);
            if (!prices) return { ok: false, message: '價格格式錯誤，請輸入正整數並以空格、逗號或換行分隔' };
            if (prices.length !== groups.length) {
                return { ok: false, message: `需要 ${groups.length} 個價格，目前${prices.length < groups.length ? '只有' : '有'} ${prices.length} 個` };
            }
            return { ok: true, text: buildStockCopyLines(groups, prices, inventoryItems) };
        }

        function formatCompletedAt(item) {
            const timestamp = getCompletedAtMs(item);
            if (timestamp === null) return '未紀錄';

            const date = new Date(timestamp);
            if (Number.isNaN(date.getTime())) return '未紀錄';

            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');

            return `${year}/${month}/${day} ${hour}:${minute}`;
        }

        function compareDoneItems(a, b, direction) {
            const aCompletedAt = getCompletedAtMs(a);
            const bCompletedAt = getCompletedAtMs(b);

            if (aCompletedAt === null && bCompletedAt !== null) return 1;
            if (aCompletedAt !== null && bCompletedAt === null) return -1;

            if (
                aCompletedAt !== null &&
                bCompletedAt !== null &&
                aCompletedAt !== bCompletedAt
            ) {
                return direction === 'asc'
                    ? aCompletedAt - bCompletedAt
                    : bCompletedAt - aCompletedAt;
            }

            const createdAtDifference =
                getCreatedAtMs(b) - getCreatedAtMs(a);

            if (createdAtDifference !== 0) {
                return createdAtDifference;
            }

            return String(a?.id || '').localeCompare(String(b?.id || ''));
        }

        function mergeInventoryItems(syncedItems, pendingItems) {
            const syncedIds = new Set(syncedItems.map(item => item.id));
            return [
                ...syncedItems,
                ...Array.from(pendingItems.values()).filter(item => !syncedIds.has(item.id))
            ];
        }

        async function reconcileLegacyLuckyTrinketLocksForRolloutCycle() {
            const cycle = getLuckyTrinketCycleForDate(getTodayStr());
            if (legacyLuckyTrinketReconciled || cycle?.id !== LEGACY_LUCKY_TRINKET_ROLLOUT_CYCLE_ID) return;
            legacyLuckyTrinketReconciled = true;
            const groups = new Map();
            syncedPokemons.filter(item => isLegacySellerRecordRelevantToCycle(item, cycle) && item.account).forEach(item => {
                const current = groups.get(item.account) || [];
                current.push(item); groups.set(item.account, current);
            });
            for (const [account, items] of groups) {
                const lockRef = getLuckyTrinketCycleLockRef(account, cycle.id);
                await runTransaction(db, async transaction => {
                    const existing = await transaction.get(lockRef);
                    if (existing.exists()) return;
                    const representative = items.find(item => item.status === 'done' || item.status === 'stock') || items[0];
                    const now = Date.now();
                    transaction.set(lockRef, { cycleId: cycle.id, account, inventoryId: representative.id, state: items.some(item => item.status === 'done' || item.status === 'stock') ? 'used' : 'reserved', reservedAt: now, usedAt: items.some(item => item.status === 'done' || item.status === 'stock') ? now : null, updatedAt: now, source: 'legacy-rollout-backfill' });

            }

        function findNextAvailableDate(accName, startDateStr = null) {
            let checkDate = new Date(); 
            if (startDateStr) {
                const parts = startDateStr.split('-');
                checkDate = new Date(parts[0], parts[1] - 1, parts[2]);
            }
            let found = false; 
            let finalDateStr = "";
            
            while (!found) {
                const year = checkDate.getFullYear();
                const month = String(checkDate.getMonth() + 1).padStart(2, '0');
                const day = String(checkDate.getDate()).padStart(2, '0');
                const dateStr = `${year}-${month}-${day}`;
                const hasTrade = pokemons.some(p => p.account === accName && p.tradeDate === dateStr && p.status !== 'stock');
                if (!hasTrade) { 
                    finalDateStr = dateStr; 
                    found = true; 
                } else { 
                    checkDate.setDate(checkDate.getDate() + 1); 
                }
            }
            return finalDateStr;
        }

        window.repackSchedule = async (accName, excludedItemId = null) => {
            const todayStr = getTodayStr();
            const pendingTrades = pokemons.filter(p => p.id !== excludedItemId && p.account === accName && p.status === 'trading');
            pendingTrades.sort((a, b) => a.tradeDate.localeCompare(b.tradeDate));

            const occupiedDates = new Set(pokemons.filter(p => p.id !== excludedItemId && p.account === accName && p.status === 'done' && p.tradeDate >= todayStr).map(p => p.tradeDate));

            for (let item of pendingTrades) {
                let checkDate = new Date();
                let found = false;
                let finalDateStr = "";
                
                while (!found) {
                    const year = checkDate.getFullYear();
                    const month = String(checkDate.getMonth() + 1).padStart(2, '0');
                    const day = String(checkDate.getDate()).padStart(2, '0');
                    const dateStr = `${year}-${month}-${day}`;

                    if (!occupiedDates.has(dateStr)) {
                        finalDateStr = dateStr;
                        occupiedDates.add(dateStr);
                        found = true;
                    } else {
                        checkDate.setDate(checkDate.getDate() + 1);
                    }
                }
                
                if (item.tradeDate !== finalDateStr) {
                    await updateDoc(doc(db, "inventory", item.id), { tradeDate: finalDateStr });
                }
            }
        };

        async function updateLuckyTrinketTrade(localItem, partner, nextTrinket) {
            const inventoryRef = doc(db, 'inventory', localItem.id);
            await runTransaction(db, async transaction => {
                const snapshot = await transaction.get(inventoryRef);
                if (!snapshot.exists() || snapshot.data().status !== 'trading') throw new Error('INVENTORY_CHANGED');
                const item = { id: localItem.id, ...snapshot.data() };
                const wasSeller = normalizeLuckyTrinket(item.luckyTrinket) === 'seller';
                const willBeSeller = nextTrinket === 'seller';
                let cycleId = wasSeller ? item.luckyTrinketCycleId : null;
                if (willBeSeller && !cycleId) {
                    const cycle = getLuckyTrinketCycleForDate(getTodayStr());
                    if (!cycle) throw new Error('NO_TRINKET_CYCLE');
                    cycleId = cycle.id;
                }
                let lockRef = null; let lockSnapshot = null;
                if (wasSeller && item.luckyTrinketCycleId) {
                    lockRef = getLuckyTrinketCycleLockRef(item.account, item.luckyTrinketCycleId);
                    lockSnapshot = await transaction.get(lockRef);
                } else if (willBeSeller) {
                    lockRef = getLuckyTrinketCycleLockRef(item.account, cycleId);
                    lockSnapshot = await transaction.get(lockRef);
                }
                if (willBeSeller) {
                    if (lockSnapshot?.exists() && isActiveLuckyTrinketCycleLock(lockSnapshot.data()) && lockSnapshot.data().inventoryId !== item.id) throw new Error('TRINKET_CONFLICT');
                    const now = Date.now();
                    if (!lockSnapshot?.exists()) transaction.set(lockRef, { cycleId, account: item.account, inventoryId: item.id, state: 'reserved', reservedAt: now, usedAt: null, updatedAt: now, source: 'runtime' });
                    transaction.update(inventoryRef, { partner, luckyTrinket: 'seller', luckyTrinketCycleId: cycleId });
                } else {
                    if (lockSnapshot?.exists() && lockSnapshot.data().state === 'reserved' && lockSnapshot.data().inventoryId === item.id) transaction.delete(lockRef);
                    transaction.update(inventoryRef, { partner, luckyTrinket: nextTrinket, luckyTrinketCycleId: deleteField() });
                }
            });
        }

            const colorType = normalizeColorType(document.getElementById('colorTypeSelect').value);

            if (!acc || !name) return alert("請填寫");
            const writes = [];
            const createdAt = new Date().getTime();
            for (let i = 0; i < qty; i++) {
                const ref = doc(collection(db, "inventory"));
                const data = { account: acc, name, colorType, backCardType, quantity: 1, status: 'stock', partner: '', tradeDate: '', createdAt: createdAt + i };
                const item = { id: ref.id, ...data };
                pendingInventoryItems.set(ref.id, item);
                writes.push({ ref, data });
            }
            document.getElementById('pokemonInput').value = '';
            document.getElementById('quantityInput').value = '1';
            document.getElementById('backCardSelect').value = 'none';
            document.getElementById('colorTypeSelect').value = 'shiny';
            rebuildEffectiveInventory();
            render();

            setTimeout(() => {
                let failureReported = false;
                writes.map(({ ref, data }) => setDoc(ref, data).catch(error => {
                    console.error('新增庫存失敗：', error);
                    pendingInventoryItems.delete(ref.id);
                    failedInventoryItemIds.add(ref.id);
                    syncedPokemons = syncedPokemons.filter(item => item.id !== ref.id);
                    rebuildEffectiveInventory();
                    render();
                    renderTimeline();
                    if (!failureReported) {
                        failureReported = true;
                        alert('新增庫存失敗，請檢查網路後重新新增。');
                    }
                }));
            }, 0);
        });

        searchInput.addEventListener('input', () => {
            clearSearchBtn.classList.toggle('hidden', searchInput.value === '');
            render();
        });
        clearSearchBtn.addEventListener('click', clearSearch);

        function render() {
            const list = document.getElementById('pokemonList'); list.innerHTML = '';
            const searchText = searchInput.value.trim().toLowerCase();

            let filtered = pokemons.filter(p => {
                const matchTab = currentTab === 'all' ? true : p.status === currentTab;
                const matchSearch = String(p.name || '').toLowerCase().includes(searchText);
                return matchTab && matchSearch;
            });

            filtered.forEach(p => {
                if (p.status === 'stock') {
                    p.nextDateStr = findNextAvailableDate(p.account);
                }
            });

            if (searchText !== '' && currentTab === 'stock') {
                filtered.sort((a, b) => {
                    if (a.status === 'stock' && b.status === 'stock') {
                        return a.nextDateStr.localeCompare(b.nextDateStr);
                    }
                    return 0;
                });
            }

            if (currentTab === 'done') {
                filtered.sort((a, b) =>
                    compareDoneItems(a, b, doneSortSelect.value)
                );
            }

            let fastestDate = null;
            if (searchText !== '' && currentTab === 'stock') {
                const stockItems = filtered.filter(p => p.status === 'stock');
                if (stockItems.length > 0) {
                    fastestDate = stockItems[0].nextDateStr; 
                }
            }

            if (!filtered.length) { list.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400 italic text-sm">找不到符合的寶可夢</div>'; return; }

                div.className = "bg-white p-4 md:p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col md:flex-row items-stretch md:items-center justify-between transition-all";
                let action = '', tag = '', stockPriceMarkup = '', actionIncludesDelete = false;
                const inventoryMetadata = formatInventoryMetadata(p);
                
                if (p.status === 'stock') {
                    const price = getStockItemSavedPrice(p, stockCopyPriceMap);
                    const priceLabel = getStockItemPriceLabel(p, stockCopyPriceMap);
                    const priceClasses = price === undefined
                        ? 'bg-amber-50 text-amber-700 border-amber-200'
                        : 'bg-emerald-50 text-emerald-700 border-emerald-200';
                    const priceAriaLabel = price === undefined ? '設定價格' : `修改價格：${price}元`;
                    stockPriceMarkup = `<button type="button" onclick="openSingleStockPriceEditor('${p.id}')" aria-label="${priceAriaLabel}" class="mt-1.5 min-h-8 w-fit rounded-lg border px-2 py-1 text-xs font-bold active:scale-95 ${priceClasses}">${priceLabel}</button>`;
                    const isFastest = (searchText !== '' && p.nextDateStr === fastestDate);
                    if (isFastest) {
                        tag = `<div class="flex items-center gap-1.5"><span class="text-blue-500 text-[9px] md:text-[10px] font-black bg-blue-50 px-2 py-0.5 rounded border border-blue-100 shrink-0">在庫</span><span class="text-red-600 text-[9px] md:text-[10px] font-black bg-red-50 px-2 py-0.5 rounded border border-red-200 shadow-sm shrink-0">🔥 推薦最快: ${p.nextDateStr}</span></div>`;
                        div.classList.add('ring-2', 'ring-red-300', 'bg-red-50/20'); 
                    } else {
                        tag = `<div class="flex items-center gap-1.5"><span class="text-blue-500 text-[9px] md:text-[10px] font-black bg-blue-50 px-2 py-0.5 rounded border border-blue-100 shrink-0">在庫</span><span class="text-purple-600 text-[9px] md:text-[10px] font-black bg-purple-50 px-2 py-0.5 rounded border border-purple-200 shrink-0">可排: ${p.nextDateStr}</span></div>`;
                    }
                    action = `<button type="button" onclick="openStockEdit('${p.id}')" class="min-h-11 bg-slate-600 text-white px-4 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md active:scale-95 shrink-0">編輯</button><button onclick="openTrade('${p.id}', '${p.account}')" class="bg-orange-500 text-white px-4 md:px-5 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md shrink-0">安排</button>`;
                } else if (p.status === 'trading') {
                    tag = `<span class="text-orange-600 text-[9px] md:text-[10px] font-black bg-orange-50 px-2 py-0.5 rounded border border-orange-200 shrink-0">${p.tradeDate} 待交換</span>`;
                    actionIncludesDelete = true;
                    action = `<div class="flex flex-col items-start gap-1.5 shrink-0"><button onclick="restoreToStock('${p.id}')" class="bg-slate-600 text-white px-3 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md active:scale-95 whitespace-nowrap min-w-[72px] shrink-0">恢復在庫</button><div class="flex items-center gap-1 md:gap-2"><button onclick="openCompleteConfirmation('${p.id}')" class="bg-green-600 text-white px-4 md:px-5 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md min-w-[72px] shrink-0">完成</button><button onclick="deleteItem('${p.id}')" class="text-red-200 hover:text-red-400 p-2 text-lg leading-none">&times;</button></div></div>`;
                } else if (p.status === 'done') {
                    tag = '<span class="text-green-700 text-[9px] md:text-[10px] font-black bg-green-50 px-2 py-0.5 rounded border border-green-100 uppercase shrink-0">Done</span>';
                    tag += `<span class="text-gray-500 text-[9px] md:text-[10px] font-bold shrink-0">完成：${formatCompletedAt(p)}</span>`;
                    actionIncludesDelete = true;
                    action = `<div class="flex flex-col items-start gap-1.5 shrink-0"><button onclick="restoreToStock('${p.id}')" class="bg-slate-600 text-white px-3 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md active:scale-95 whitespace-nowrap min-w-[72px] shrink-0">恢復在庫</button><div class="flex items-center gap-1 md:gap-2"><div class="bg-green-500 text-white px-3 md:px-4 py-2 rounded-xl text-[10px] md:text-xs font-black min-w-[72px] text-center shrink-0">已完成</div><button onclick="deleteItem('${p.id}')" class="text-red-200 hover:text-red-400 p-2 text-lg leading-none">&times;</button></div></div>`;
                }
                const luckyTrinketLabel = p.status === 'trading' ? getLuckyTrinketLabel(p.luckyTrinket) : '';
                div.innerHTML = `<div class="flex flex-col flex-1 min-w-0 w-full md:pr-2"><div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-2 mb-2 md:mb-1"><div class="flex flex-wrap items-center gap-1.5 md:gap-2">${tag}</div><div class="flex items-center gap-1 min-w-0 w-full md:w-auto"><span class="text-[9px] md:text-[10px] text-gray-400 font-mono truncate min-w-0">@${p.account}</span><button onclick="copy('${p.account}', this)" class="text-[9px] md:text-[10px] text-blue-400 font-bold shrink-0">複製</button></div></div>${inventoryMetadata ? `<span class="text-xs font-black text-purple-600 mb-0.5">${inventoryMetadata}</span>` : ''}<span class="text-base md:text-lg font-black text-gray-800 truncate w-full">${p.name}</span>${stockPriceMarkup}${p.partner ? `<div class="flex items-center gap-2 mt-0.5 min-w-0"><span class="text-[10px] text-indigo-500 font-bold uppercase tracking-tighter truncate min-w-0">買家: ${p.partner}</span><button onclick="copy('${p.partner}', this)" class="text-[9px] text-indigo-400 font-bold shrink-0">複製</button></div>` : ''}${luckyTrinketLabel ? `<span class="mt-1 text-[10px] font-bold text-amber-700">✨ ${luckyTrinketLabel}</span>` : ''}</div><div class="flex items-center justify-end gap-1 md:gap-2 shrink-0 w-full md:w-auto mt-2 md:mt-0">${action}${actionIncludesDelete ? '' : `<button onclick="deleteItem('${p.id}')" class="text-red-200 hover:text-red-400 p-2 text-lg leading-none">&times;</button>`}</div>`;
                list.appendChild(div);
            });
        }

        document.getElementById('cancelTradeBtn').addEventListener('click', () => document.getElementById('tradeModal').classList.add('hidden'));
        
        window.updateStatus = async (id, status) => {
            const item = pokemons.find(p => p.id === id);
            if (status === 'done' && normalizeLuckyTrinket(item?.luckyTrinket) === 'seller') {
                const inventoryRef = doc(db, 'inventory', id);
                await runTransaction(db, async transaction => {
                    const snapshot = await transaction.get(inventoryRef);
                    if (!snapshot.exists() || snapshot.data().status !== 'trading') throw new Error('INVENTORY_CHANGED');
                    const current = { id, ...snapshot.data() };
                    let cycleId = current.luckyTrinketCycleId;
                    const rolloutCycle = LUCKY_TRINKET_CYCLES.find(cycle => cycle.id === LEGACY_LUCKY_TRINKET_ROLLOUT_CYCLE_ID);
                    if (!cycleId && isLegacySellerRecordRelevantToCycle(current, rolloutCycle)) cycleId = rolloutCycle.id;
                    if (!cycleId) throw new Error('無法判定舊首飾交換所屬週期');
                    const lockRef = getLuckyTrinketCycleLockRef(current.account, cycleId);
                    const lockSnapshot = await transaction.get(lockRef);
                    if (lockSnapshot.exists() && lockSnapshot.data().inventoryId !== id) throw new Error('首飾鎖屬於其他交換，無法完成');
                    const now = Date.now();
                    const reservedAt = lockSnapshot.exists() ? lockSnapshot.data().reservedAt || now : now;
                    transaction.set(lockRef, { cycleId, account: current.account, inventoryId: id, state: 'used', reservedAt, usedAt: now, updatedAt: now, source: lockSnapshot.exists() ? lockSnapshot.data().source || 'runtime' : 'legacy-rollout-backfill' });
                    transaction.update(inventoryRef, { status: 'done', completedAt: now, luckyTrinketCycleId: cycleId });
                });
            } else {
                const updates = status === 'done' ? { status: 'done', completedAt: Date.now() } : { status };
                await updateDoc(doc(db, "inventory", id), updates);
            }
            if (status === 'done' && item) {
                setTimeout(() => window.repackSchedule(item.account), 800);
            }
        };

        window.restoreToStock = async (id) => {
            const item = pokemons.find(p => p.id === id);
            if (!item || !['trading', 'done'].includes(item.status)) {
                alert('找不到可恢復的寶可夢，請重新整理後再試。');
                return;
            }

            const confirmed = confirm(`確定要將「${item.name}」恢復在庫嗎？\n\n買家與交換日期會被清除，該帳號後續待交換排程會自動往前遞補。`);
            if (!confirmed) return;

            try {
                await runTransaction(db, async transaction => {
                    const inventoryRef = doc(db, 'inventory', item.id);
                    const snapshot = await transaction.get(inventoryRef);
                    if (!snapshot.exists()) throw new Error('INVENTORY_CHANGED');
                    const current = { id: item.id, ...snapshot.data() };
                    if (current.status === 'trading' && normalizeLuckyTrinket(current.luckyTrinket) === 'seller' && current.luckyTrinketCycleId) {
                        const lockRef = getLuckyTrinketCycleLockRef(current.account, current.luckyTrinketCycleId);
                        const lockSnapshot = await transaction.get(lockRef);
                        if (lockSnapshot.exists() && lockSnapshot.data().state === 'reserved' && lockSnapshot.data().inventoryId === current.id) transaction.delete(lockRef);
                    }
                    const updates = { status: 'stock', partner: '', tradeDate: '', completedAt: deleteField() };
                    if (current.status === 'trading') { updates.luckyTrinket = deleteField(); updates.luckyTrinketCycleId = deleteField(); }
                    transaction.update(inventoryRef, updates);
                });
            } catch (error) {
                console.error('恢復在庫失敗：', error);
                alert('恢復在庫失敗，請檢查網路後再試一次。');
                return;
            }

            try {
                await window.repackSchedule(item.account, item.id);
            } catch (error) {
                console.error('已恢復在庫，但重新排列待交換排程失敗：', error);
                alert('寶可夢已恢復在庫，但待交換排程自動遞補失敗，請稍後再試。');
            }
        };

        window.deleteItem = async (id) => { 
            const item = pokemons.find(p => p.id === id);
            if(confirm('確定刪除項目？')) {
                await runTransaction(db, async transaction => {
                    const inventoryRef = doc(db, 'inventory', id);
                    const snapshot = await transaction.get(inventoryRef);
                    if (!snapshot.exists()) return;
                    const current = { id, ...snapshot.data() };
                    if (current.status === 'trading' && normalizeLuckyTrinket(current.luckyTrinket) === 'seller' && current.luckyTrinketCycleId) {
                        const lockRef = getLuckyTrinketCycleLockRef(current.account, current.luckyTrinketCycleId);
                        const lockSnapshot = await transaction.get(lockRef);
                        if (lockSnapshot.exists() && lockSnapshot.data().state === 'reserved' && lockSnapshot.data().inventoryId === id) transaction.delete(lockRef);
                    }
                    transaction.delete(inventoryRef);
                });
                if (item && item.status === 'trading') {
                    setTimeout(() => window.repackSchedule(item.account), 800);
                }
            }
        };

        window.deleteAccount = async (id) => {
            const account = savedAccounts.find(acc => acc.id === id);
            if (!account) {
                alert('找不到此帳號，請重新整理後再試。');
                return;
            }

            const stockItems = pokemons.filter(
                p => p.account === account.name && p.status === 'stock'
            );

            const confirmed = confirm(
                `確定刪除帳號「${account.name}」？\n\n` +
                `此帳號的 ${stockItems.length} 筆在庫寶可夢會一併刪除。\n` +
                '待交換與已完成紀錄會保留。'
            );
            if (!confirmed) return;

            try {
                await Promise.all(
                    stockItems.map(item => deleteDoc(doc(db, "inventory", item.id)))
                );
                await deleteDoc(doc(db, "accounts", id));
            } catch (error) {
                console.error('刪除帳號失敗：', error);
                alert('刪除失敗，請檢查網路後再試一次。');
            }
        };
        window.copy = (text, btn) => { navigator.clipboard.writeText(text); const old = btn.innerText; btn.innerText = 'OK!'; btn.style.color = '#10B981'; setTimeout(() => { btn.innerText = old; btn.style.color = ''; }, 1000); };
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', (e) => {
            currentTab = e.target.dataset.tab;
            doneSortSelect.classList.toggle('hidden', currentTab !== 'done');
            document.querySelectorAll('.tab-btn').forEach(b => b.className = "tab-btn px-4 md:px-6 py-2 rounded-xl text-gray-500 font-bold text-sm");
            e.target.className = "tab-btn px-4 md:px-6 py-2 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-md";
            clearSearch(); 
        }));

        doneSortSelect.addEventListener('change', render);

        function insertPriceSeparator(input) {
            const start = input.selectionStart ?? input.value.length;
            const end = input.selectionEnd ?? start;
            input.setRangeText(',', start, end, 'end');
            input.focus();
        }

        function getCopyPriceTargetLabel(group, index) {
            return `${index + 1}. 【${getLuckyTrinketAccountDisplayName(group.account)}】${group.label}`;
        }

        function closeSingleStockPriceEditor() {
            singleStockPriceModal.classList.add('hidden');
            editingStockPriceItemId = null;
            editingStockPriceKey = null;
            singleStockPriceMessage.textContent = '';
        }

        window.openSingleStockPriceEditor = (id) => {

            if (!item || item.status !== 'stock') return;
            const priceKey = getInventoryGroupingKey(item);
            const currentPrice = stockCopyPriceMap.get(priceKey);

            editingStockPriceKey = priceKey;
            singleStockPriceAccount.textContent = getLuckyTrinketAccountDisplayName(item.account);

            });

        singleStockPriceModal.addEventListener('click', event => {
            if (event.target === singleStockPriceModal && !isSavingSingleStockPrice) closeSingleStockPriceEditor();
        });

        document.getElementById('saveSingleStockPriceBtn').addEventListener('click', async () => {
            if (isSavingSingleStockPrice) return;
            const price = parseSingleStockPrice(singleStockPriceInput.value);
            if (price === null) {
                singleStockPriceMessage.textContent = '請輸入有效的正整數價格';

        function refreshStockCopyPriceUi(message = '') {
            const prices = getSavedCopyPrices(currentCopyGroups, stockCopyPriceMap);

                ? `已設定價格：${savedCount} 項　尚未設定：${missingTargets.length} 項`

        document.getElementById('generateCopyBtn').addEventListener('click', () => {

        document.getElementById('applyCopyPricesBtn').addEventListener('click', async () => {
            const targets = editingAllCopyPrices
                ? currentCopyGroups
                : getMissingCopyPriceTargets(currentCopyGroups, stockCopyPriceMap);
            const result = getCopyPriceBatchResult(targets, copyPriceInput.value, editingAllCopyPrices);
            const message = document.getElementById('copyPriceMessage');
            message.textContent = result.ok ? '' : result.message;
            message.classList.toggle('text-red-600', !result.ok);
            message.classList.toggle('text-green-600', result.ok);
            if (!result.ok) return;

            const batch = writeBatch(db);
            result.entries.forEach(({ group, price }) => {
                batch.set(
                    doc(db, "stockCopyPrices", encodeURIComponent(group.priceKey)),
                    {
                        priceKey: group.priceKey,
                        account: group.account,
                        name: group.name,
                        colorType: group.colorType,
                        backCardType: group.backCardType,
                        price,
                        updatedAt: Date.now()
                    },
                    { merge: true }
                );
            });
            try {
                await batch.commit();
            } catch (error) {
                console.error('儲存現貨文案價格失敗：', error);
                message.textContent = '價格儲存失敗，請檢查網路後再試一次';
                message.classList.add('text-red-600');
                message.classList.remove('text-green-600');
                return;
            }
            result.entries.forEach(({ group, price }) => stockCopyPriceMap.set(group.priceKey, price));
            editingAllCopyPrices = false;
            copyPriceInput.value = '';
            message.classList.remove('text-red-600');
            message.classList.add('text-green-600');
            refreshStockCopyPriceUi('價格已儲存');
            if (currentTab === 'stock' || currentTab === 'all') render();
        });

        document.getElementById('closeCopyModalBtn').addEventListener('click', () => {
            document.getElementById('copyModal').classList.add('hidden');
        });

        document.getElementById('doCopyBtn').addEventListener('click', (e) => {
            navigator.clipboard.writeText(buildFullStockCopyText(document.getElementById('copyTextarea').value));
            const btn = e.target;
            const old = btn.innerText;
            btn.innerText = '已複製！';
            setTimeout(() => { btn.innerText = old; }, 1500);
        });

        function setupFilterCopyButton(buttonId, filterText) {
            const button = document.getElementById(buttonId);
            if (!button) {
                console.error(`找不到複製篩選按鈕：${buttonId}`);
                return;
            }

            button.addEventListener('click', () => {
                navigator.clipboard.writeText(filterText).catch((error) => {
                    console.error('複製 Pokémon GO 搜尋條件失敗：', error);
                });
            });
        }

        setupFilterCopyButton('copyCostumeFilterBtn', '特殊&異色&!交換');
        setupFilterCopyButton('copyBackgroundFilterBtn', '背卡&異色&!交換');

        setInterval(checkAndRescheduleOverdue, 60000);
    </script>
</body>
</html>
