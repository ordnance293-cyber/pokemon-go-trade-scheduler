<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶可夢交換管理系統 v6.14 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); background-attachment: fixed; min-height: 100vh; overscroll-behavior-y: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        .date-card { transition: all 0.3s ease; min-width: 200px; }
        @media (max-width: 640px) { .date-card { min-width: 160px; } }
        
        /* 🔥 iPad 終極剋星：徹底封殺長按「拷貝/反白」選單 */
        .drag-item, .drag-item span, .drag-item div, .done-item, .done-item span, .done-item div { 
            -webkit-touch-callout: none !important; /* 禁用 iOS 長按彈出選單 */
            -webkit-user-select: none !important;   /* 禁用 Safari 文字反白 */
            user-select: none !important;           /* 禁用一般文字反白 */
        }
        .drag-item { touch-action: pan-y; cursor: grab; }
        .drag-item:active { cursor: grabbing; }
        
        .sortable-ghost { opacity: 0.4; background-color: #ffedd5; border: 2px dashed #f97316; }
    </style>
</head>
<body class="p-3 md:p-8 font-sans text-gray-900">
    <div class="max-w-5xl mx-auto space-y-4 md:space-y-6">
        
        <div class="text-center py-2 md:py-4">
            <h1 class="text-2xl md:text-3xl font-extrabold text-white drop-shadow-md tracking-widest uppercase">Pokémon Trade Manager</h1>
            <p class="text-blue-100 text-xs md:text-sm mt-1 opacity-80 mb-3">一帳號一天僅限一次交換 (提早完成自動遞補版 v6.14)</p>
            <button id="copyFilterBtn" class="px-6 py-2 rounded-full bg-pink-500 text-white font-bold text-sm shadow-lg hover:bg-pink-600 active:scale-95 transition-all">📋 背卡</button>
        </div>

        <div class="glass-panel p-4 md:p-5 rounded-2xl shadow-xl border-l-8 border-green-500">
            <div class="flex flex-col md:flex-row items-start md:items-center gap-4">
                <div class="flex items-center gap-3 shrink-0 w-full md:w-auto">
                    <span class="font-bold text-gray-700 shrink-0 text-sm md:text-base">帳號管理</span>
                    <input type="text" id="newAccountInput" placeholder="輸入帳號" class="flex-1 md:w-40 bg-white border border-gray-200 p-2 rounded-xl focus:ring-2 focus:ring-green-400 outline-none text-sm shadow-sm">
                    <button id="saveAccountBtn" class="bg-green-600 text-white px-4 py-2 rounded-xl hover:bg-green-700 transition-all text-sm font-bold shadow-md active:scale-95 shrink-0">保存</button>
                </div>
                <div id="accountTags" class="flex flex-wrap gap-2 flex-1"></div>
            </div>
        </div>

        <div class="glass-panel p-5 md:p-6 rounded-3xl shadow-2xl">
            <div class="flex items-center gap-2 mb-4">
                <div class="w-2 h-6 bg-blue-500 rounded-full"></div>
                <h2 class="text-lg md:text-xl font-bold text-gray-800">新增庫存</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-3 md:p-4 bg-white/50 rounded-2xl border border-white/50">
                <div class="space-y-1">
                    <label class="block text-[10px] md:text-xs font-bold text-blue-600 ml-1 uppercase">選擇帳號</label>
                    <select id="accountSelect" class="border-0 bg-white p-2.5 rounded-xl w-full shadow-sm text-sm">
                        <option value="">-- 選擇帳號 --</option>
                    </select>
                </div>
                <div class="md:col-span-2 space-y-1">
                    <label class="block text-[10px] md:text-xs font-bold text-blue-600 ml-1 uppercase">寶可夢與數量</label>
                    <div class="flex gap-2">
                        <input type="text" id="pokemonInput" placeholder="輸入寶可夢名稱" class="border-0 bg-white p-2.5 rounded-xl flex-1 shadow-sm text-sm">
                        <input type="number" id="quantityInput" min="1" value="1" class="border-0 bg-white p-2.5 rounded-xl w-16 md:w-20 text-center shadow-sm text-sm font-bold">
                        <button id="addPokemonBtn" class="bg-blue-600 text-white px-4 md:px-8 py-2.5 rounded-xl hover:bg-blue-700 transition-all font-bold shadow-lg active:scale-95 text-sm">新增</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-panel p-5 md:p-6 rounded-3xl shadow-2xl border-t-8 border-orange-400">
            <div class="flex items-center gap-2 mb-4">
                <div class="w-2 h-6 bg-orange-500 rounded-full"></div>
                <h2 class="text-lg md:text-xl font-bold text-gray-800">📅 待交換清單 (僅顯示當日與未來，已完成自動隱藏)</h2>
            </div>
            <div id="scheduleTimeline" class="flex gap-3 md:gap-4 overflow-x-auto pb-4"></div>
        </div>

        <div class="glass-panel p-5 md:p-6 rounded-3xl shadow-2xl">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b border-gray-200 pb-4">
                <div class="flex flex-wrap gap-2">
                    <button class="tab-btn px-4 md:px-6 py-2 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-md" data-tab="stock">在庫</button>
                    <button class="tab-btn px-4 md:px-6 py-2 rounded-xl text-gray-500 font-bold text-sm" data-tab="trading">待交換</button>
                    <button class="tab-btn px-4 md:px-6 py-2 rounded-xl text-gray-500 font-bold text-sm" data-tab="done">已完成</button>
                    <button class="tab-btn px-4 md:px-6 py-2 rounded-xl text-gray-500 font-bold text-sm" data-tab="all">全部</button>
                    <button id="generateCopyBtn" class="px-4 md:px-6 py-2 rounded-xl bg-purple-600 text-white font-bold text-sm shadow-md hover:bg-purple-700 active:scale-95 transition-all">📝 現貨文案</button>
                </div>
                <div class="w-full md:w-auto relative flex items-center">
                    <span class="absolute left-3 text-gray-400 text-sm">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜尋寶可夢或帳號..." class="w-full md:w-56 pl-9 pr-8 py-2 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold shadow-sm transition-all">
                    <button id="clearSearchBtn" class="absolute right-3 text-gray-300 hover:text-gray-500 hidden text-lg font-black leading-none focus:outline-none">&times;</button>
                </div>
            </div>
            <div id="pokemonList" class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4"></div>
        </div>
    </div>

    <div id="tradeModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-[300px] text-center">
            <h2 class="text-xl font-black text-gray-800 tracking-tight">安排交換</h2>
            <p id="targetAccLabel" class="text-blue-500 text-sm font-bold mt-1"></p>
            <input type="text" id="partnerInput" placeholder="買家名稱" class="border border-gray-200 p-3 rounded-2xl w-full mt-4 text-center focus:ring-2 focus:ring-orange-400 outline-none font-bold text-sm">
            <div class="flex gap-2 mt-5">
                <button id="cancelTradeBtn" class="flex-1 py-2 text-gray-400 font-bold text-sm">取消</button>
                <button id="confirmTradeBtn" class="flex-[2] bg-orange-500 text-white py-2 rounded-2xl font-bold hover:bg-orange-600 active:scale-95 shadow-md text-sm transition-all">確認排隊</button>
            </div>
        </div>
    </div>

    <div id="copyModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-[400px]">
            <h2 class="text-xl font-black text-gray-800 tracking-tight mb-4 text-center">📝 現貨文案</h2>
            <textarea id="copyTextarea" class="w-full h-48 p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-400 outline-none text-sm font-bold resize-none mb-4 text-gray-700"></textarea>
            <div class="flex gap-2">
                <button id="closeCopyModalBtn" class="flex-1 py-2 text-gray-400 font-bold text-sm">關閉</button>
                <button id="doCopyBtn" class="flex-[2] bg-purple-600 text-white py-2 rounded-2xl font-bold hover:bg-purple-700 active:scale-95 shadow-md text-sm transition-all">複製文案</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, updateDoc, doc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBG_bVJ6-SxRHPBWyUmQUCICMfsvc9ixg4",
            authDomain: "pokemon-a2b5c.firebaseapp.com",
            projectId: "pokemon-a2b5c",
            storageBucket: "pokemon-a2b5c.firebasestorage.app",
            messagingSenderId: "961491205971",
            appId: "1:961491205971:web:28e7edf7885d03e2c0eba6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentTab = 'stock', pokemons = [], savedAccounts = [], selectedId = null, selectedAccName = null;
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');

        // Helper: 獲取今日日期字串 YYYY-MM-DD
        function getTodayStr() {
            const today = new Date();
            return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        }

        onSnapshot(query(collection(db, "accounts"), orderBy("name")), (snapshot) => {
            savedAccounts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const select = document.getElementById('accountSelect'), tags = document.getElementById('accountTags');
            select.innerHTML = '<option value="">-- 選擇帳號 --</option>';
            tags.innerHTML = '';
            savedAccounts.forEach(acc => {
                const opt = document.createElement('option'); opt.value = acc.name; opt.textContent = acc.name; select.appendChild(opt);
                const span = document.createElement('div');
                span.className = "bg-green-100 text-green-700 px-3 py-1 rounded-xl text-[10px] md:text-xs font-bold border border-green-200 flex items-center gap-1 shadow-sm";
                span.innerHTML = `${acc.name} <button onclick="deleteAccount('${acc.id}')" class="text-red-400">×</button>`;
                tags.appendChild(span);
            });
        });

        function checkAndRescheduleOverdue() {
            if (!pokemons.length) return;
            const todayStr = getTodayStr();
            const overdueItems = pokemons.filter(p => p.status === 'trading' && p.tradeDate && p.tradeDate < todayStr);
            
            if (overdueItems.length > 0) {
                let tempPokemons = [...pokemons]; 
                
                overdueItems.forEach(item => {
                    let newDateStr = findNextAvailableDate(item.account, todayStr);
                    const idx = tempPokemons.findIndex(p => p.id === item.id);
                    if (idx > -1) tempPokemons[idx].tradeDate = newDateStr;
                    updateDoc(doc(db, "inventory", item.id), { tradeDate: newDateStr });
                });
            }
        }

        onSnapshot(query(collection(db, "inventory")), (snapshot) => {
            pokemons = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            pokemons.sort((a, b) => (a.tradeDate || '9999').localeCompare(b.tradeDate || '9999') || b.createdAt - a.createdAt);
            
            checkAndRescheduleOverdue(); 
            render(); renderTimeline();
        });

        function renderTimeline() {
            const timeline = document.getElementById('scheduleTimeline');
            const todayStr = getTodayStr();
            
            const tradingItems = pokemons.filter(p => p.status === 'trading' && p.tradeDate);
            
            if (!tradingItems.length) { timeline.innerHTML = '<div class="text-gray-400 py-4 italic text-sm">✨ 暫無待交換任務</div>'; return; }
            
            const groups = {};
            tradingItems.forEach(p => { if (!groups[p.tradeDate]) groups[p.tradeDate] = []; groups[p.tradeDate].push(p); });
            
            const sortedDates = Object.keys(groups).filter(d => d >= todayStr).sort();
            timeline.innerHTML = '';
            
            if (sortedDates.length === 0) {
                timeline.innerHTML = '<div class="text-gray-400 py-4 italic text-sm">✨ 近期無排程</div>';
                return;
            }

            sortedDates.forEach(date => {
                const box = document.createElement('div'); 
                box.className = "bg-white rounded-2xl p-3 md:p-4 shadow-md border border-orange-100 date-card flex-shrink-0 flex flex-col";
                
                const label = (date === todayStr) ? ' (今天)' : '';
                let inner = `<div class="font-black text-orange-600 border-b pb-1.5 mb-2 text-sm">${date}${label}</div>`;
                box.innerHTML = inner;
                
                const listContainer = document.createElement('div');
                listContainer.className = "flex-1 space-y-2 min-h-[40px]"; 
                listContainer.dataset.date = date;

                groups[date].forEach(p => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = "text-[11px] p-2 rounded-xl border-l-4 font-bold shadow-sm transition-transform bg-gray-50 border-orange-400 drag-item";
                    itemDiv.dataset.id = p.id;
                    itemDiv.dataset.account = p.account;
                    
                    itemDiv.innerHTML = `
                        <div class="flex justify-between items-center text-gray-400 text-[9px]">
                            <span class="flex items-center">@${p.account}</span>
                            <button onclick="copy('${p.account}', this)" class="text-blue-500 px-2 py-1 -mr-2 bg-transparent shrink-0 relative z-10 pointer-events-auto" style="-webkit-touch-callout: default;">複製</button>
                        </div>
                        <div class="flex justify-between items-center mt-0.5">
                            <span class="truncate pr-1 pointer-events-none text-gray-700">${p.name}➔${p.partner}</span>
                            <button onclick="copy('${p.partner}', this)" class="text-blue-500 shrink-0 px-2 py-1 -mr-2 bg-transparent relative z-10 pointer-events-auto" style="-webkit-touch-callout: default;">複製</button>
                        </div>
                    `;
                    listContainer.appendChild(itemDiv);
                });
                
                box.appendChild(listContainer);
                timeline.appendChild(box);

                new Sortable(listContainer, {
                    group: 'shared-timeline', 
                    animation: 150,
                    delay: 250, 
                    delayOnTouchOnly: true, 
                    fallbackTolerance: 5, 
                    ghostClass: 'sortable-ghost',
                    filter: 'button', 
                    preventOnFilter: false,
                    onEnd: async function (evt) {
                        const itemEl = evt.item;
                        const toList = evt.to;
                        const fromList = evt.from;
                        if (toList === fromList) return; 
                        
                        const itemId = itemEl.dataset.id;
                        const accName = itemEl.dataset.account;
                        const newDate = toList.dataset.date;
                        
                        const conflictItem = pokemons.find(p => p.account === accName && p.tradeDate === newDate && p.status !== 'stock' && p.id !== itemId);
                        
                        if (conflictItem) {
                            if (conflictItem.status === 'done') {
                                alert(`@${accName} 於 ${newDate} 已經有已完成的交易，無法覆蓋！`);
                                renderTimeline(); 
                                return;
                            }
                            const parts = newDate.split('-');
                            let searchDate = new Date(parts[0], parts[1] - 1, parts[2]);
                            searchDate.setDate(searchDate.getDate() + 1);
                            const searchDateStr = `${searchDate.getFullYear()}-${String(searchDate.getMonth() + 1).padStart(2, '0')}-${String(searchDate.getDate()).padStart(2, '0')}`;
                            const pushDate = findNextAvailableDate(accName, searchDateStr);
                            await updateDoc(doc(db, "inventory", conflictItem.id), { tradeDate: pushDate });
                        }
                        await updateDoc(doc(db, "inventory", itemId), { tradeDate: newDate });
                    }
                });
            });
        }

        function findNextAvailableDate(accName, startDateStr = null) {
            let checkDate = new Date(); 
            if (startDateStr) {
                const parts = startDateStr.split('-');
                checkDate = new Date(parts[0], parts[1] - 1, parts[2]);
            }
            let found = false; 
            let finalDateStr = "";
            
            while (!found) {
                const year = checkDate.getFullYear();
                const month = String(checkDate.getMonth() + 1).padStart(2, '0');
                const day = String(checkDate.getDate()).padStart(2, '0');
                const dateStr = `${year}-${month}-${day}`;
                const hasTrade = pokemons.some(p => p.account === accName && p.tradeDate === dateStr && p.status !== 'stock');
                if (!hasTrade) { 
                    finalDateStr = dateStr; 
                    found = true; 
                } else { 
                    checkDate.setDate(checkDate.getDate() + 1); 
                }
            }
            return finalDateStr;
        }

        window.repackSchedule = async (accName) => {
            const todayStr = getTodayStr();
            const pendingTrades = pokemons.filter(p => p.account === accName && p.status === 'trading');
            pendingTrades.sort((a, b) => a.tradeDate.localeCompare(b.tradeDate));

            const occupiedDates = new Set(pokemons.filter(p => p.account === accName && p.status === 'done' && p.tradeDate >= todayStr).map(p => p.tradeDate));

            for (let item of pendingTrades) {
                let checkDate = new Date();
                let found = false;
                let finalDateStr = "";
                
                while (!found) {
                    const year = checkDate.getFullYear();
                    const month = String(checkDate.getMonth() + 1).padStart(2, '0');
                    const day = String(checkDate.getDate()).padStart(2, '0');
                    const dateStr = `${year}-${month}-${day}`;

                    if (!occupiedDates.has(dateStr)) {
                        finalDateStr = dateStr;
                        occupiedDates.add(dateStr);
                        found = true;
                    } else {
                        checkDate.setDate(checkDate.getDate() + 1);
                    }
                }
                
                if (item.tradeDate !== finalDateStr) {
                    await updateDoc(doc(db, "inventory", item.id), { tradeDate: finalDateStr });
                }
            }
        };

        window.openTrade = (id, accName) => {
            selectedId = id; selectedAccName = accName;
            document.getElementById('targetAccLabel').innerText = `@${accName}`;
            document.getElementById('partnerInput').value = '';
            document.getElementById('tradeModal').classList.remove('hidden');
        };

        function clearSearch() {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            render();
        }

        document.getElementById('confirmTradeBtn').addEventListener('click', async () => {
            const partner = document.getElementById('partnerInput').value.trim();
            if (!partner) return alert("輸入買家");
            const autoDate = findNextAvailableDate(selectedAccName);
            await updateDoc(doc(db, "inventory", selectedId), { status: 'trading', partner, tradeDate: autoDate });
            document.getElementById('tradeModal').classList.add('hidden');
            clearSearch(); 
        });

        document.getElementById('saveAccountBtn').addEventListener('click', async () => {
            const name = document.getElementById('newAccountInput').value.trim();
            if (name) await addDoc(collection(db, "accounts"), { name });
            document.getElementById('newAccountInput').value = '';
        });

        document.getElementById('addPokemonBtn').addEventListener('click', async () => {
            const acc = document.getElementById('accountSelect').value, name = document.getElementById('pokemonInput').value.trim(), qty = parseInt(document.getElementById('quantityInput').value) || 1;
            if (!acc || !name) return alert("請填寫");
            for (let i = 0; i < qty; i++) { await addDoc(collection(db, "inventory"), { account: acc, name, quantity: 1, status: 'stock', partner: '', tradeDate: '', createdAt: new Date().getTime() + i }); }
            document.getElementById('pokemonInput').value = '';
            document.getElementById('quantityInput').value = '1'; 
            document.getElementById('accountSelect').value = ''; 
        });

        searchInput.addEventListener('input', () => {
            clearSearchBtn.classList.toggle('hidden', searchInput.value === '');
            render();
        });
        clearSearchBtn.addEventListener('click', clearSearch);

        function render() {
            const list = document.getElementById('pokemonList'); list.innerHTML = '';
            const searchText = searchInput.value.trim().toLowerCase();

            let filtered = pokemons.filter(p => {
                const matchTab = currentTab === 'all' ? true : p.status === currentTab;
                const matchSearch = p.name.toLowerCase().includes(searchText) || p.account.toLowerCase().includes(searchText);
                return matchTab && matchSearch;
            });

            filtered.forEach(p => {
                if (p.status === 'stock') {
                    p.nextDateStr = findNextAvailableDate(p.account);
                }
            });

            if (searchText !== '' && currentTab === 'stock') {
                filtered.sort((a, b) => {
                    if (a.status === 'stock' && b.status === 'stock') {
                        return a.nextDateStr.localeCompare(b.nextDateStr);
                    }
                    return 0;
                });
            }

            let fastestDate = null;
            if (searchText !== '' && currentTab === 'stock') {
                const stockItems = filtered.filter(p => p.status === 'stock');
                if (stockItems.length > 0) {
                    fastestDate = stockItems[0].nextDateStr; 
                }
            }

            if (!filtered.length) { list.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400 italic text-sm">找不到符合的寶可夢或帳號</div>'; return; }
            
            filtered.forEach(p => {
                const div = document.createElement('div');
                div.className = "bg-white p-4 md:p-5 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between transition-all";
                let action = '', tag = '';
                
                if (p.status === 'stock') {
                    const isFastest = (searchText !== '' && p.nextDateStr === fastestDate);
                    if (isFastest) {
                        tag = `<div class="flex items-center gap-1.5"><span class="text-blue-500 text-[9px] md:text-[10px] font-black bg-blue-50 px-2 py-0.5 rounded border border-blue-100 shrink-0">在庫</span><span class="text-red-600 text-[9px] md:text-[10px] font-black bg-red-50 px-2 py-0.5 rounded border border-red-200 shadow-sm shrink-0">🔥 推薦最快: ${p.nextDateStr}</span></div>`;
                        div.classList.add('ring-2', 'ring-red-300', 'bg-red-50/20'); 
                    } else {
                        tag = `<div class="flex items-center gap-1.5"><span class="text-blue-500 text-[9px] md:text-[10px] font-black bg-blue-50 px-2 py-0.5 rounded border border-blue-100 shrink-0">在庫</span><span class="text-purple-600 text-[9px] md:text-[10px] font-black bg-purple-50 px-2 py-0.5 rounded border border-purple-200 shrink-0">可排: ${p.nextDateStr}</span></div>`;
                    }
                    action = `<button onclick="openTrade('${p.id}', '${p.account}')" class="bg-orange-500 text-white px-4 md:px-5 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md shrink-0">安排</button>`;
                } else if (p.status === 'trading') {
                    tag = `<span class="text-orange-600 text-[9px] md:text-[10px] font-black bg-orange-50 px-2 py-0.5 rounded border border-orange-200 shrink-0">${p.tradeDate} 待交換</span>`;
                    action = `<button onclick="updateStatus('${p.id}', 'done')" class="bg-green-600 text-white px-4 md:px-5 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md shrink-0">完成</button>`;
                } else {
                    tag = '<span class="text-green-700 text-[9px] md:text-[10px] font-black bg-green-50 px-2 py-0.5 rounded border border-green-100 uppercase shrink-0">Done</span>';
                    action = `<div class="bg-green-500 text-white px-3 md:px-4 py-2 rounded-xl text-[10px] md:text-xs font-black shrink-0">已完成</div>`;
                }
                
                div.innerHTML = `<div class="flex flex-col flex-1 overflow-hidden pr-2"><div class="flex items-center gap-1.5 md:gap-2 mb-1">${tag}<div class="flex items-center gap-1 truncate"><span class="text-[9px] md:text-[10px] text-gray-400 font-mono truncate">@${p.account}</span><button onclick="copy('${p.account}', this)" class="text-[9px] md:text-[10px] text-blue-400 font-bold shrink-0">複製</button></div></div><span class="text-base md:text-lg font-black text-gray-800 truncate">${p.name}</span>${p.partner ? `<div class="flex items-center gap-2 mt-0.5"><span class="text-[10px] text-indigo-500 font-bold uppercase tracking-tighter truncate">買家: ${p.partner}</span><button onclick="copy('${p.partner}', this)" class="text-[9px] text-indigo-400 font-bold shrink-0">複製</button></div>` : ''}</div><div class="flex items-center gap-1 md:gap-2 shrink-0">${action}<button onclick="deleteItem('${p.id}')" class="text-red-200 hover:text-red-400 p-2 text-lg leading-none">&times;</button></div>`;
                list.appendChild(div);
            });
        }

        document.getElementById('cancelTradeBtn').addEventListener('click', () => document.getElementById('tradeModal').classList.add('hidden'));
        
        window.updateStatus = async (id, status) => {
            const item = pokemons.find(p => p.id === id);
            await updateDoc(doc(db, "inventory", id), { status });
            if (status === 'done' && item) {
                setTimeout(() => window.repackSchedule(item.account), 800);
            }
        };

        window.deleteItem = async (id) => { 
            const item = pokemons.find(p => p.id === id);
            if(confirm('確定刪除項目？')) {
                await deleteDoc(doc(db, "inventory", id)); 
                if (item && item.status === 'trading') {
                    setTimeout(() => window.repackSchedule(item.account), 800);
                }
            }
        };

        window.deleteAccount = async (id) => {
            const account = savedAccounts.find(acc => acc.id === id);
            if (!account) {
                alert('找不到此帳號，請重新整理後再試。');
                return;
            }

            const stockItems = pokemons.filter(
                p => p.account === account.name && p.status === 'stock'
            );

            const confirmed = confirm(
                `確定刪除帳號「${account.name}」？\n\n` +
                `此帳號的 ${stockItems.length} 筆在庫寶可夢會一併刪除。\n` +
                '待交換與已完成紀錄會保留。'
            );
            if (!confirmed) return;

            try {
                await Promise.all(
                    stockItems.map(item => deleteDoc(doc(db, "inventory", item.id)))
                );
                await deleteDoc(doc(db, "accounts", id));
            } catch (error) {
                console.error('刪除帳號失敗：', error);
                alert('刪除失敗，請檢查網路後再試一次。');
            }
        };
        window.copy = (text, btn) => { navigator.clipboard.writeText(text); const old = btn.innerText; btn.innerText = 'OK!'; btn.style.color = '#10B981'; setTimeout(() => { btn.innerText = old; btn.style.color = ''; }, 1000); };
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', (e) => {
            currentTab = e.target.dataset.tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.className = "tab-btn px-4 md:px-6 py-2 rounded-xl text-gray-500 font-bold text-sm");
            e.target.className = "tab-btn px-4 md:px-6 py-2 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-md";
            clearSearch(); 
        }));

        document.getElementById('generateCopyBtn').addEventListener('click', () => {
            const stockItems = pokemons.filter(p => p.status === 'stock');
            const counts = {};
            
            stockItems.forEach(p => {
                counts[p.name] = (counts[p.name] || 0) + 1;
            });
            
            let text = "";
            for (const [name, qty] of Object.entries(counts)) {
                // 🔥 修改：當數量為 1 時，不顯示備註；大於 1 才顯示「（現貨X隻）」
                if (qty === 1) {
                    text += `${name}\n`;
                } else {
                    text += `${name}（現貨${qty}隻）\n`;
                }
            }
            
            if (!text) text = "目前無現貨寶可夢。";
            
            document.getElementById('copyTextarea').value = text.trim();
            document.getElementById('copyModal').classList.remove('hidden');
        });

        document.getElementById('closeCopyModalBtn').addEventListener('click', () => {
            document.getElementById('copyModal').classList.add('hidden');
        });

        document.getElementById('doCopyBtn').addEventListener('click', (e) => {
            const text = document.getElementById('copyTextarea').value;
            navigator.clipboard.writeText(text);
            const btn = e.target;
            const old = btn.innerText;
            btn.innerText = '已複製！';
            setTimeout(() => { btn.innerText = old; }, 1500);
        });

        document.getElementById('copyFilterBtn').addEventListener('click', (e) => {
            navigator.clipboard.writeText("背卡&異色&!交換");
            const btn = e.target;
            const oldText = btn.innerText;
            btn.innerText = '已複製！';
            setTimeout(() => { btn.innerText = oldText; }, 1000);
        });

        setInterval(checkAndRescheduleOverdue, 60000);
    </script>
</body>
</html>
