    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); background-attachment: fixed; min-height: 100vh; overscroll-behavior-y: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        button,
        a,
        input,
        select,
        textarea {
            touch-action: manipulation;
        }
        @media (max-width: 767px) {
            input,
            select,
            textarea {
                font-size: 16px !important;
            }
        }
        .date-card { transition: all 0.3s ease; min-width: 200px; }
        @media (max-width: 640px) { .date-card { min-width: 160px; } }
        
        /* 🔥 iPad 終極剋星：徹底封殺長按「拷貝/反白」選單 */
        .drag-item, .drag-item span, .drag-item div, .done-item, .done-item span, .done-item div { 
            -webkit-touch-callout: none !important; /* 禁用 iOS 長按彈出選單 */
            -webkit-user-select: none !important;   /* 禁用 Safari 文字反白 */
            user-select: none !important;           /* 禁用一般文字反白 */
        }
        .drag-item { touch-action: pan-y; cursor: grab; }
        .drag-item:active { cursor: grabbing; }
        
        .sortable-ghost { opacity: 0.4; background-color: #ffedd5; border: 2px dashed #f97316; }
    </style>
</head>

        function normalizeLuckyTrinket(value) {
            return value === 'buyer' || value === 'seller' ? value : null;
        }

        function getLuckyTrinketLabel(value) {
            if (value === 'buyer') return '亮晶晶首飾（他出）';
            if (value === 'seller') return '亮晶晶首飾（我出）';
            return '';
        }

        function getLuckyTrinketShortLabel(value) {
            const label = getLuckyTrinketLabel(value);
            if (!label) return '';
            return value === 'buyer' ? '他出首飾' : '我出首飾';
        }

        function updateLuckyTrinketButtons(value, buyerButton, sellerButton) {
            const selectedClasses = ['bg-amber-400', 'border-orange-500', 'text-amber-950'];
            const unselectedClasses = ['bg-white', 'border-gray-300', 'text-gray-500'];

                const isSelected = value === option;
                button.setAttribute('aria-pressed', String(isSelected));
                button.classList.remove(...(isSelected ? unselectedClasses : selectedClasses));
                button.classList.add(...(isSelected ? selectedClasses : unselectedClasses));
            });
        }

        function setLuckyTrinketSelection(value) {
            selectedLuckyTrinket = normalizeLuckyTrinket(value);
            updateLuckyTrinketButtons(selectedLuckyTrinket, luckyTrinketBuyerBtn, luckyTrinketSellerBtn);
        }

        function setEditingLuckyTrinketSelection(value) {
            editingLuckyTrinket = normalizeLuckyTrinket(value);
            updateLuckyTrinketButtons(editingLuckyTrinket, editLuckyTrinketBuyerBtn, editLuckyTrinketSellerBtn);
        }

        // Helper: 獲取今日日期字串 YYYY-MM-DD
        function getTodayStr() {
            const today = new Date();
            return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        }

        function getCompletedAtMs(item) {
            const value = item?.completedAt;
            return Number.isFinite(value) && value > 0 ? value : null;
        }

        function getCreatedAtMs(item) {
            const value = item?.createdAt;
            return Number.isFinite(value) && value > 0 ? value : 0;
        }

        function normalizeInventoryYear(value) {
            return Number.isInteger(value) && value >= 2016 && value <= 2026 ? value : null;
        }

        function normalizeColorType(value) {
            return value === 'shiny' ? 'shiny' : 'normal';
        }

        function normalizeBackCardType(value) {
            return value === 'special' || value === 'commemorative' ? value : 'none';
        }

        function populateEditStockAccountSelect(currentAccount = '') {
            editStockAccountSelect.innerHTML = '';
            const accountNames = savedAccounts.map(account => account.name).filter(Boolean);
            if (currentAccount && !accountNames.includes(currentAccount)) {
                accountNames.unshift(currentAccount);
            }
            accountNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                editStockAccountSelect.appendChild(option);
            });
            editStockAccountSelect.value = currentAccount;
        }

        function formatInventoryMetadata(item) {
            const year = normalizeInventoryYear(item?.year);
            const colorLabel = normalizeColorType(item?.colorType) === 'shiny' ? '異色' : '普色';
            const backCardLabels = { none: '', special: '特別背卡', commemorative: '紀念背卡' };
            const backCardLabel = backCardLabels[normalizeBackCardType(item?.backCardType)];
            return [year === null ? '' : `${String(year).slice(-2)}年`, colorLabel, backCardLabel].filter(Boolean).join(' | ');
        }

        function formatInventoryCopyText(item) {
            const year = normalizeInventoryYear(item?.year);
            const backCardLabels = { none: '', special: '特別背卡', commemorative: '紀念背卡' };
            const yearLabel = year === null ? '' : `${String(year).slice(-2)}年`;
            const colorLabel = normalizeColorType(item?.colorType) === 'shiny' ? '異色' : '';
            const backCardLabel = backCardLabels[normalizeBackCardType(item?.backCardType)];
            return `${yearLabel}${colorLabel}${backCardLabel}${item?.name || ''}`;
        }

        function getInventoryGroupingKey(item) {
    return JSON.stringify([
        String(item?.account || ''),
        normalizeInventoryYear(item?.year),
        normalizeColorType(item?.colorType),
        normalizeBackCardType(item?.backCardType),
        item?.name || ''
    ]);
}

        function getStockInventoryCount(items) {
            return items.filter(item => item.status === 'stock').length;
        }

        function parseCopyPrices(text) {
            const trimmed = text.trim();
            if (!trimmed || !/^[\d\s,]+$/.test(trimmed)) return null;
            const prices = trimmed.split(/[\s,]+/);
            return prices.every(price => /^[1-9]\d*$/.test(price)) ? prices.map(Number) : null;
        }

        function buildStockCopyLines(groups, prices = null) {
    if (!groups.length) return '目前無現貨寶可夢。';

    const hasAccountSections = groups.every(group =>
        Object.prototype.hasOwnProperty.call(group, 'account')
    );

    if (!hasAccountSections) {
        return groups.map(({ label, quantity }, index) => {
            const stockLabel = quantity === 1 ? label : `${label}（現貨${quantity}隻）`;
            const priceLabel = prices ? `｜1隻${prices[index]}元` : '';
            return `🔥 ${stockLabel}${priceLabel}`;
        }).join('\n');
    }

    const sections = new Map();
    groups.forEach(group => {
        const account = String(group.account || '');
        if (!sections.has(account)) sections.set(account, []);
        sections.get(account).push(group);
    });

    let priceIndex = 0;
    return Array.from(sections, ([account, accountGroups]) => {
        const lines = accountGroups.map(({ label, quantity }) => {
            const stockLabel = quantity === 1 ? label : `${label}（現貨${quantity}隻）`;
            const priceLabel = prices ? `｜1隻${prices[priceIndex]}元` : '';
            priceIndex += 1;
            return `🔥 ${stockLabel}${priceLabel}`;
        });
        return `【${account.slice(0, 6)}】\n${lines.join('\n')}`;
    }).join('\n\n');
}

        function getCopyPriceResult(groups, text) {
            if (!groups.length) return { ok: false, message: '目前沒有現貨文案可套用價格' };
            const prices = parseCopyPrices(text);
            if (!prices) return { ok: false, message: '價格格式錯誤，請輸入正整數並以空格、逗號或換行分隔' };
            if (prices.length !== groups.length) {
                return { ok: false, message: `需要 ${groups.length} 個價格，目前${prices.length < groups.length ? '只有' : '有'} ${prices.length} 個` };
            }
            return { ok: true, text: buildStockCopyLines(groups, prices) };
        }

        function formatCompletedAt(item) {
            const timestamp = getCompletedAtMs(item);
            if (timestamp === null) return '未紀錄';

            const date = new Date(timestamp);
            if (Number.isNaN(date.getTime())) return '未紀錄';

            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');

            return `${year}/${month}/${day} ${hour}:${minute}`;
        }

        function compareDoneItems(a, b, direction) {
            const aCompletedAt = getCompletedAtMs(a);
            const bCompletedAt = getCompletedAtMs(b);

            if (aCompletedAt === null && bCompletedAt !== null) return 1;
            if (aCompletedAt !== null && bCompletedAt === null) return -1;

            if (
                aCompletedAt !== null &&
                bCompletedAt !== null &&
                aCompletedAt !== bCompletedAt
            ) {
                return direction === 'asc'
                    ? aCompletedAt - bCompletedAt
                    : bCompletedAt - aCompletedAt;
            }

            const createdAtDifference =
                getCreatedAtMs(b) - getCreatedAtMs(a);

            if (createdAtDifference !== 0) {
                return createdAtDifference;
            }

            return String(a?.id || '').localeCompare(String(b?.id || ''));
        }

        function mergeInventoryItems(syncedItems, pendingItems) {
            const syncedIds = new Set(syncedItems.map(item => item.id));
            return [
                ...syncedItems,
                ...Array.from(pendingItems.values()).filter(item => !syncedIds.has(item.id))
            ];
        }

        function rebuildEffectiveInventory() {
            pokemons = mergeInventoryItems(syncedPokemons, pendingInventoryItems);
            pokemons.sort((a, b) => (a.tradeDate || '9999').localeCompare(b.tradeDate || '9999') || b.createdAt - a.createdAt);
        }

        onSnapshot(collection(db, "accounts"), (snapshot) => {
            savedAccounts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            savedAccounts.sort((a, b) => {
                const aCreatedAt = Number.isFinite(a.createdAt) ? a.createdAt : 0;
                const bCreatedAt = Number.isFinite(b.createdAt) ? b.createdAt : 0;
                return bCreatedAt - aCreatedAt || String(a.name || '').localeCompare(String(b.name || ''), 'zh-TW');
            });
            const select = document.getElementById('accountSelect'), tags = document.getElementById('accountTags');
            select.innerHTML = '<option value="">-- 選擇帳號 --</option>';
            tags.innerHTML = '';
            savedAccounts.forEach(acc => {
                const opt = document.createElement('option'); opt.value = acc.name; opt.textContent = acc.name; select.appendChild(opt);
                const span = document.createElement('div');
                span.className = "bg-green-100 text-green-700 px-3 py-1 rounded-xl text-[10px] md:text-xs font-bold border border-green-200 flex items-center gap-1 shadow-sm";
                span.innerHTML = `${acc.name} <button onclick="deleteAccount('${acc.id}')" class="text-red-400">×</button>`;
                tags.appendChild(span);
            });
            if (editingStockId === null) populateEditStockAccountSelect();
        });

        function checkAndRescheduleOverdue() {
            if (!pokemons.length) return;
            const todayStr = getTodayStr();
            const overdueItems = pokemons.filter(p => p.status === 'trading' && p.tradeDate && p.tradeDate < todayStr);
            
            if (overdueItems.length > 0) {
                let tempPokemons = [...pokemons]; 
                
                overdueItems.forEach(item => {
                    let newDateStr = findNextAvailableDate(item.account, todayStr);
                    const idx = tempPokemons.findIndex(p => p.id === item.id);
                    if (idx > -1) tempPokemons[idx].tradeDate = newDateStr;
                    updateDoc(doc(db, "inventory", item.id), { tradeDate: newDateStr });
                });
            }
        }

        onSnapshot(query(collection(db, "inventory")), (snapshot) => {
            syncedPokemons = snapshot.docs
                .map(doc => ({ id: doc.id, ...doc.data() }))
                .filter(item => !failedInventoryItemIds.has(item.id));
            const syncedIds = new Set(syncedPokemons.map(item => item.id));
            syncedIds.forEach(id => pendingInventoryItems.delete(id));
            rebuildEffectiveInventory();
            
            checkAndRescheduleOverdue(); 
            render(); renderTimeline();
        });

        function renderTimeline() {
            const timeline = document.getElementById('scheduleTimeline');
            const todayStr = getTodayStr();
            
            const tradingItems = pokemons.filter(p => p.status === 'trading' && p.tradeDate);
            
            if (!tradingItems.length) { timeline.innerHTML = '<div class="text-gray-400 py-4 italic text-sm">✨ 暫無待交換任務</div>'; return; }
            
            const groups = {};
            tradingItems.forEach(p => { if (!groups[p.tradeDate]) groups[p.tradeDate] = []; groups[p.tradeDate].push(p); });
            
            const sortedDates = Object.keys(groups).filter(d => d >= todayStr).sort();
            timeline.innerHTML = '';
            
            if (sortedDates.length === 0) {
                timeline.innerHTML = '<div class="text-gray-400 py-4 italic text-sm">✨ 近期無排程</div>';
                return;
            }

            sortedDates.forEach(date => {
                const box = document.createElement('div'); 
                box.className = "bg-white rounded-2xl p-3 md:p-4 shadow-md border border-orange-100 date-card flex-shrink-0 flex flex-col";
                
                const label = (date === todayStr) ? ' (今天)' : '';
                let inner = `<div class="font-black text-orange-600 border-b pb-1.5 mb-2 text-sm">${date}${label}</div>`;
                box.innerHTML = inner;
                
                const listContainer = document.createElement('div');
                listContainer.className = "flex-1 space-y-2 min-h-[40px]"; 
                listContainer.dataset.date = date;

                groups[date].forEach(p => {
                    const luckyTrinketLabel = getLuckyTrinketShortLabel(p.luckyTrinket);
                    const itemDiv = document.createElement('div');
                    itemDiv.className = "text-[11px] p-2 rounded-xl border-l-4 font-bold shadow-sm transition-transform bg-gray-50 border-orange-400 drag-item";
                    itemDiv.dataset.id = p.id;
                    itemDiv.dataset.account = p.account;
                    
                    itemDiv.innerHTML = `
                        <div class="flex justify-between items-center text-gray-400 text-[9px]">
                            <span class="flex items-center">@${p.account}</span>
                            <button onclick="copy('${p.account}', this)" class="text-blue-500 px-2 py-1 -mr-2 bg-transparent shrink-0 relative z-10 pointer-events-auto" style="-webkit-touch-callout: default;">複製</button>
                        </div>
                        <div class="flex justify-between items-center mt-0.5">
                            <span class="truncate pr-1 pointer-events-none text-gray-700">${formatInventoryCopyText(p)}➔${p.partner}</span>
                            <button onclick="copy('${p.partner}', this)" class="text-blue-500 shrink-0 px-2 py-1 -mr-2 bg-transparent relative z-10 pointer-events-auto" style="-webkit-touch-callout: default;">複製</button>
                        </div>
                        <div class="flex justify-between items-center mt-1 min-h-8">
                            <span class="text-amber-700">${luckyTrinketLabel ? `✨ ${luckyTrinketLabel}` : ''}</span>
                            <button type="button" onclick="openTradeEdit('${p.id}')" class="min-h-9 rounded-lg border border-orange-300 bg-orange-50 px-3 py-1 font-black text-orange-600 relative z-10 pointer-events-auto">編輯</button>
                        </div>
                    `;
                    listContainer.appendChild(itemDiv);
                });
                
                box.appendChild(listContainer);
                timeline.appendChild(box);

                new Sortable(listContainer, {
                    group: 'shared-timeline', 
                    animation: 150,
                    delay: 250, 
                    delayOnTouchOnly: true, 
                    fallbackTolerance: 5, 
                    ghostClass: 'sortable-ghost',
                    filter: 'button', 
                    preventOnFilter: false,
                    onEnd: async function (evt) {
                        const itemEl = evt.item;
                        const toList = evt.to;
                        const fromList = evt.from;
                        if (toList === fromList) return; 
                        
                        const itemId = itemEl.dataset.id;
                        const accName = itemEl.dataset.account;
                        const newDate = toList.dataset.date;
                        
                        const conflictItem = pokemons.find(p => p.account === accName && p.tradeDate === newDate && p.status !== 'stock' && p.id !== itemId);
                        
                        if (conflictItem) {
                            if (conflictItem.status === 'done') {
                                alert(`@${accName} 於 ${newDate} 已經有已完成的交易，無法覆蓋！`);
                                renderTimeline(); 
                                return;
                            }
                            const parts = newDate.split('-');
                            let searchDate = new Date(parts[0], parts[1] - 1, parts[2]);
                            searchDate.setDate(searchDate.getDate() + 1);
                            const searchDateStr = `${searchDate.getFullYear()}-${String(searchDate.getMonth() + 1).padStart(2, '0')}-${String(searchDate.getDate()).padStart(2, '0')}`;
                            const pushDate = findNextAvailableDate(accName, searchDateStr);
                            await updateDoc(doc(db, "inventory", conflictItem.id), { tradeDate: pushDate });
                        }
                        await updateDoc(doc(db, "inventory", itemId), { tradeDate: newDate });
                    }
                });
            });
        }

        function findNextAvailableDate(accName, startDateStr = null) {
            let checkDate = new Date(); 
            if (startDateStr) {
                const parts = startDateStr.split('-');
                checkDate = new Date(parts[0], parts[1] - 1, parts[2]);
            }
            let found = false; 
            let finalDateStr = "";
            
            while (!found) {
                const year = checkDate.getFullYear();
                const month = String(checkDate.getMonth() + 1).padStart(2, '0');
                const day = String(checkDate.getDate()).padStart(2, '0');
                const dateStr = `${year}-${month}-${day}`;
                const hasTrade = pokemons.some(p => p.account === accName && p.tradeDate === dateStr && p.status !== 'stock');
                if (!hasTrade) { 
                    finalDateStr = dateStr; 
                    found = true; 
                } else { 
                    checkDate.setDate(checkDate.getDate() + 1); 
                }
            }
            return finalDateStr;
        }

        window.repackSchedule = async (accName, excludedItemId = null) => {
            const todayStr = getTodayStr();
            const pendingTrades = pokemons.filter(p => p.id !== excludedItemId && p.account === accName && p.status === 'trading');
            pendingTrades.sort((a, b) => a.tradeDate.localeCompare(b.tradeDate));

            const occupiedDates = new Set(pokemons.filter(p => p.id !== excludedItemId && p.account === accName && p.status === 'done' && p.tradeDate >= todayStr).map(p => p.tradeDate));

            for (let item of pendingTrades) {
                let checkDate = new Date();
                let found = false;
                let finalDateStr = "";
                
                while (!found) {
                    const year = checkDate.getFullYear();
                    const month = String(checkDate.getMonth() + 1).padStart(2, '0');
                    const day = String(checkDate.getDate()).padStart(2, '0');
                    const dateStr = `${year}-${month}-${day}`;

                    if (!occupiedDates.has(dateStr)) {
                        finalDateStr = dateStr;
                        occupiedDates.add(dateStr);
                        found = true;
                    } else {
                        checkDate.setDate(checkDate.getDate() + 1);
                    }
                }
                
                if (item.tradeDate !== finalDateStr) {
                    await updateDoc(doc(db, "inventory", item.id), { tradeDate: finalDateStr });
                }
            }
        };

        document.getElementById('addPokemonBtn').addEventListener('click', async () => {
            const acc = document.getElementById('accountSelect').value, name = document.getElementById('pokemonInput').value.trim(), qty = parseInt(document.getElementById('quantityInput').value) || 1;
            const year = Number(document.getElementById('yearSelect').value);
            const colorType = normalizeColorType(document.getElementById('colorTypeSelect').value);
            const backCardType = document.getElementById('backCardSelect').value;
            if (!acc || !name) return alert("請填寫");
            const writes = [];
            const createdAt = new Date().getTime();
            for (let i = 0; i < qty; i++) {
                const ref = doc(collection(db, "inventory"));
                const data = { account: acc, name, year, colorType, backCardType, quantity: 1, status: 'stock', partner: '', tradeDate: '', createdAt: createdAt + i };
                const item = { id: ref.id, ...data };

            document.getElementById('yearSelect').value = '2026';
            document.getElementById('backCardSelect').value = 'none';
            document.getElementById('colorTypeSelect').value = 'shiny';
            rebuildEffectiveInventory();
            render();

            setTimeout(() => {
                let failureReported = false;
                writes.map(({ ref, data }) => setDoc(ref, data).catch(error => {
                    console.error('新增庫存失敗：', error);
                    pendingInventoryItems.delete(ref.id);
                    failedInventoryItemIds.add(ref.id);
                    syncedPokemons = syncedPokemons.filter(item => item.id !== ref.id);
                    rebuildEffectiveInventory();
                    render();
                    renderTimeline();
                    if (!failureReported) {
                        failureReported = true;
                        alert('新增庫存失敗，請檢查網路後重新新增。');
                    }
                }));
            }, 0);
        });

        searchInput.addEventListener('input', () => {
            clearSearchBtn.classList.toggle('hidden', searchInput.value === '');
            render();
        });
        clearSearchBtn.addEventListener('click', clearSearch);

        function render() {
            const list = document.getElementById('pokemonList'); list.innerHTML = '';
            const searchText = searchInput.value.trim().toLowerCase();

            let filtered = pokemons.filter(p => {
                const matchTab = currentTab === 'all' ? true : p.status === currentTab;
                const matchSearch = String(p.name || '').toLowerCase().includes(searchText);
                return matchTab && matchSearch;
            });

            filtered.forEach(p => {
                if (p.status === 'stock') {
                    p.nextDateStr = findNextAvailableDate(p.account);
                }
            });

            if (searchText !== '' && currentTab === 'stock') {
                filtered.sort((a, b) => {
                    if (a.status === 'stock' && b.status === 'stock') {
                        return a.nextDateStr.localeCompare(b.nextDateStr);
                    }
                    return 0;
                });
            }

            if (currentTab === 'done') {
                filtered.sort((a, b) =>
                    compareDoneItems(a, b, doneSortSelect.value)
                );
            }

            let fastestDate = null;
            if (searchText !== '' && currentTab === 'stock') {
                const stockItems = filtered.filter(p => p.status === 'stock');
                if (stockItems.length > 0) {
                    fastestDate = stockItems[0].nextDateStr; 
                }
            }

            if (!filtered.length) { list.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400 italic text-sm">找不到符合的寶可夢</div>'; return; }
            
            filtered.forEach(p => {
                const div = document.createElement('div');
                div.className = "bg-white p-4 md:p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col md:flex-row items-stretch md:items-center justify-between transition-all";
                let action = '', tag = '', actionIncludesDelete = false;
                const inventoryMetadata = formatInventoryMetadata(p);
                
                if (p.status === 'stock') {
                    const isFastest = (searchText !== '' && p.nextDateStr === fastestDate);
                    if (isFastest) {
                        tag = `<div class="flex items-center gap-1.5"><span class="text-blue-500 text-[9px] md:text-[10px] font-black bg-blue-50 px-2 py-0.5 rounded border border-blue-100 shrink-0">在庫</span><span class="text-red-600 text-[9px] md:text-[10px] font-black bg-red-50 px-2 py-0.5 rounded border border-red-200 shadow-sm shrink-0">🔥 推薦最快: ${p.nextDateStr}</span></div>`;
                        div.classList.add('ring-2', 'ring-red-300', 'bg-red-50/20'); 
                    } else {
                        tag = `<div class="flex items-center gap-1.5"><span class="text-blue-500 text-[9px] md:text-[10px] font-black bg-blue-50 px-2 py-0.5 rounded border border-blue-100 shrink-0">在庫</span><span class="text-purple-600 text-[9px] md:text-[10px] font-black bg-purple-50 px-2 py-0.5 rounded border border-purple-200 shrink-0">可排: ${p.nextDateStr}</span></div>`;
                    }
                    action = `<button type="button" onclick="openStockEdit('${p.id}')" class="min-h-11 bg-slate-600 text-white px-4 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md active:scale-95 shrink-0">編輯</button><button onclick="openTrade('${p.id}', '${p.account}')" class="bg-orange-500 text-white px-4 md:px-5 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md shrink-0">安排</button>`;
                } else if (p.status === 'trading') {
                    tag = `<span class="text-orange-600 text-[9px] md:text-[10px] font-black bg-orange-50 px-2 py-0.5 rounded border border-orange-200 shrink-0">${p.tradeDate} 待交換</span>`;
                    actionIncludesDelete = true;
                    action = `<div class="flex flex-col items-start gap-1.5 shrink-0"><button onclick="restoreToStock('${p.id}')" class="bg-slate-600 text-white px-3 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md active:scale-95 whitespace-nowrap min-w-[72px] shrink-0">恢復在庫</button><div class="flex items-center gap-1 md:gap-2"><button onclick="openCompleteConfirmation('${p.id}')" class="bg-green-600 text-white px-4 md:px-5 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md min-w-[72px] shrink-0">完成</button><button onclick="deleteItem('${p.id}')" class="text-red-200 hover:text-red-400 p-2 text-lg leading-none">&times;</button></div></div>`;
                } else if (p.status === 'done') {
                    tag = '<span class="text-green-700 text-[9px] md:text-[10px] font-black bg-green-50 px-2 py-0.5 rounded border border-green-100 uppercase shrink-0">Done</span>';
                    tag += `<span class="text-gray-500 text-[9px] md:text-[10px] font-bold shrink-0">完成：${formatCompletedAt(p)}</span>`;
                    actionIncludesDelete = true;
                    action = `<div class="flex flex-col items-start gap-1.5 shrink-0"><button onclick="restoreToStock('${p.id}')" class="bg-slate-600 text-white px-3 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md active:scale-95 whitespace-nowrap min-w-[72px] shrink-0">恢復在庫</button><div class="flex items-center gap-1 md:gap-2"><div class="bg-green-500 text-white px-3 md:px-4 py-2 rounded-xl text-[10px] md:text-xs font-black min-w-[72px] text-center shrink-0">已完成</div><button onclick="deleteItem('${p.id}')" class="text-red-200 hover:text-red-400 p-2 text-lg leading-none">&times;</button></div></div>`;
                }
                const luckyTrinketLabel = p.status === 'trading' ? getLuckyTrinketLabel(p.luckyTrinket) : '';
                div.innerHTML = `<div class="flex flex-col flex-1 min-w-0 w-full md:pr-2"><div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-2 mb-2 md:mb-1"><div class="flex flex-wrap items-center gap-1.5 md:gap-2">${tag}</div><div class="flex items-center gap-1 min-w-0 w-full md:w-auto"><span class="text-[9px] md:text-[10px] text-gray-400 font-mono truncate min-w-0">@${p.account}</span><button onclick="copy('${p.account}', this)" class="text-[9px] md:text-[10px] text-blue-400 font-bold shrink-0">複製</button></div></div>${inventoryMetadata ? `<span class="text-xs font-black text-purple-600 mb-0.5">${inventoryMetadata}</span>` : ''}<span class="text-base md:text-lg font-black text-gray-800 truncate w-full">${p.name}</span>${p.partner ? `<div class="flex items-center gap-2 mt-0.5 min-w-0"><span class="text-[10px] text-indigo-500 font-bold uppercase tracking-tighter truncate min-w-0">買家: ${p.partner}</span><button onclick="copy('${p.partner}', this)" class="text-[9px] text-indigo-400 font-bold shrink-0">複製</button></div>` : ''}${luckyTrinketLabel ? `<span class="mt-1 text-[10px] font-bold text-amber-700">✨ ${luckyTrinketLabel}</span>` : ''}</div><div class="flex items-center justify-end gap-1 md:gap-2 shrink-0 w-full md:w-auto mt-2 md:mt-0">${action}${actionIncludesDelete ? '' : `<button onclick="deleteItem('${p.id}')" class="text-red-200 hover:text-red-400 p-2 text-lg leading-none">&times;</button>`}</div>`;
                list.appendChild(div);
            });
        }

        document.getElementById('cancelTradeBtn').addEventListener('click', () => document.getElementById('tradeModal').classList.add('hidden'));
        
        window.updateStatus = async (id, status) => {
            const item = pokemons.find(p => p.id === id);
            const updates = status === 'done' ? { status: 'done', completedAt: Date.now() } : { status };
            await updateDoc(doc(db, "inventory", id), updates);
            if (status === 'done' && item) {
                setTimeout(() => window.repackSchedule(item.account), 800);
            }
        };

        window.restoreToStock = async (id) => {
            const item = pokemons.find(p => p.id === id);
            if (!item || !['trading', 'done'].includes(item.status)) {
                alert('找不到可恢復的寶可夢，請重新整理後再試。');
                return;
            }

            const confirmed = confirm(`確定要將「${item.name}」恢復在庫嗎？\n\n買家與交換日期會被清除，該帳號後續待交換排程會自動往前遞補。`);
            if (!confirmed) return;

            try {
                await updateDoc(doc(db, "inventory", item.id), {
                    status: 'stock',
                    partner: '',
                    tradeDate: '',
                    completedAt: deleteField()
                });
            } catch (error) {
                console.error('恢復在庫失敗：', error);
                alert('恢復在庫失敗，請檢查網路後再試一次。');
                return;
            }

            try {
                await window.repackSchedule(item.account, item.id);
            } catch (error) {
                console.error('已恢復在庫，但重新排列待交換排程失敗：', error);
                alert('寶可夢已恢復在庫，但待交換排程自動遞補失敗，請稍後再試。');
            }
        };

        window.deleteItem = async (id) => { 
            const item = pokemons.find(p => p.id === id);
            if(confirm('確定刪除項目？')) {
                await deleteDoc(doc(db, "inventory", id)); 
                if (item && item.status === 'trading') {
                    setTimeout(() => window.repackSchedule(item.account), 800);
                }
            }
        };

        window.deleteAccount = async (id) => {
            const account = savedAccounts.find(acc => acc.id === id);
            if (!account) {
                alert('找不到此帳號，請重新整理後再試。');
                return;
            }

            const stockItems = pokemons.filter(
                p => p.account === account.name && p.status === 'stock'
            );

            const confirmed = confirm(
                `確定刪除帳號「${account.name}」？\n\n` +
                `此帳號的 ${stockItems.length} 筆在庫寶可夢會一併刪除。\n` +
                '待交換與已完成紀錄會保留。'
            );
            if (!confirmed) return;

            try {
                await Promise.all(
                    stockItems.map(item => deleteDoc(doc(db, "inventory", item.id)))
                );
                await deleteDoc(doc(db, "accounts", id));
            } catch (error) {
                console.error('刪除帳號失敗：', error);
                alert('刪除失敗，請檢查網路後再試一次。');
            }
        };
        window.copy = (text, btn) => { navigator.clipboard.writeText(text); const old = btn.innerText; btn.innerText = 'OK!'; btn.style.color = '#10B981'; setTimeout(() => { btn.innerText = old; btn.style.color = ''; }, 1000); };
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', (e) => {
            currentTab = e.target.dataset.tab;
            doneSortSelect.classList.toggle('hidden', currentTab !== 'done');
            document.querySelectorAll('.tab-btn').forEach(b => b.className = "tab-btn px-4 md:px-6 py-2 rounded-xl text-gray-500 font-bold text-sm");
            e.target.className = "tab-btn px-4 md:px-6 py-2 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-md";
            clearSearch(); 
        }));

        doneSortSelect.addEventListener('change', render);

        function insertPriceSeparator(input) {
            const start = input.selectionStart ?? input.value.length;
            const end = input.selectionEnd ?? start;
            input.setRangeText(',', start, end, 'end');
            input.focus();
        }

        document.getElementById('generateCopyBtn').addEventListener('click', () => {
            const stockItems = pokemons.filter(p => p.status === 'stock');
            document.getElementById('copyStockCount').textContent = `總庫存：${getStockInventoryCount(stockItems)} 隻`;
            const groups = new Map();
            
            stockItems.forEach(p => {
                const key = getInventoryGroupingKey(p);
                const group = groups.get(key) || { account: String(p.account || ''), label: formatInventoryCopyText(p), quantity: 0 };
                group.quantity += 1;
                groups.set(key, group);
            });

            currentCopyGroups = Array.from(groups.values());
            document.getElementById('copyPriceInput').value = '';
            document.getElementById('copyPriceMessage').textContent = '';
            document.getElementById('copyTextarea').value = buildStockCopyLines(currentCopyGroups);
            document.getElementById('copyModal').classList.remove('hidden');
        });

        const copyPriceInput = document.getElementById('copyPriceInput');
        const insertPriceSeparatorBtn = document.getElementById('insertPriceSeparatorBtn');
        insertPriceSeparatorBtn.addEventListener('mousedown', (event) => event.preventDefault());
        insertPriceSeparatorBtn.addEventListener('click', () => insertPriceSeparator(copyPriceInput));

        document.getElementById('applyCopyPricesBtn').addEventListener('click', () => {
            const result = getCopyPriceResult(currentCopyGroups, document.getElementById('copyPriceInput').value);
            const message = document.getElementById('copyPriceMessage');
            message.textContent = result.ok ? '價格已套用' : result.message;
            message.classList.toggle('text-red-600', !result.ok);
            message.classList.toggle('text-green-600', result.ok);
            if (result.ok) document.getElementById('copyTextarea').value = result.text;
        });

        document.getElementById('closeCopyModalBtn').addEventListener('click', () => {
            document.getElementById('copyModal').classList.add('hidden');
        });

        document.getElementById('doCopyBtn').addEventListener('click', (e) => {
            const text = document.getElementById('copyTextarea').value;
            navigator.clipboard.writeText(text);
            const btn = e.target;
            const old = btn.innerText;
            btn.innerText = '已複製！';
            setTimeout(() => { btn.innerText = old; }, 1500);
        });

        function setupFilterCopyButton(buttonId, filterText) {
            const button = document.getElementById(buttonId);
            if (!button) {
                console.error(`找不到複製篩選按鈕：${buttonId}`);
                return;
            }

            button.addEventListener('click', () => {
                navigator.clipboard.writeText(filterText).catch((error) => {
                    console.error('複製 Pokémon GO 搜尋條件失敗：', error);
                });
            });
        }

        setupFilterCopyButton('copyCostumeFilterBtn', '特殊&異色&!交換');
        setupFilterCopyButton('copyBackgroundFilterBtn', '背卡&異色&!交換');

        setInterval(checkAndRescheduleOverdue, 60000);
    </script>
</body>
</html>
