name: Complete confirmation tests

on:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply completion confirmation implementation
        run: node scripts/apply-completion-confirmation.mjs

      - name: Run completion confirmation tests
        run: node --test tests/complete-confirmation.test.mjs

      - name: Commit implementation when needed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already contains the implementation."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: confirm before completing trades"
          git push origin "HEAD:${{ github.head_ref }}"
