name: Apply account-grouped stock copy

on:
  push:
    branches:
      - codex/group-stock-copy-by-account

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/group-stock-copy-by-account
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add account-grouping regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/inventory-color-and-stock-count.test.mjs')
          text = path.read_text(encoding='utf-8')
          anchor = "test('copy prices accept spaces, commas, and newlines', () => {"
          assert text.count(anchor) == 1, 'test insertion anchor changed'
          addition = r"""
          test('stock copy grouping key keeps full accounts separate when the displayed prefixes match', () => {
              const { getInventoryGroupingKey } = loadHelpers();
              const variant = { year: 2026, colorType: 'shiny', backCardType: 'none', name: '皮卡丘' };
              assert.notEqual(
                  getInventoryGroupingKey({ ...variant, account: 'abcdef111111' }),
                  getInventoryGroupingKey({ ...variant, account: 'abcdef222222' })
              );
          });

          test('stock copy groups by full account and displays only each account first six characters', () => {
              const { buildStockCopyLines } = loadHelpers();
              const groups = [
                  { account: 'abcdef111111', label: '26年異色皮卡丘', quantity: 2 },
                  { account: 'xyz789654321', label: '26年異色夢幻', quantity: 1 },
                  { account: 'abcdef111111', label: '26年異色烈空坐', quantity: 1 },
                  { account: 'abcdef222222', label: '26年異色超夢', quantity: 1 }
              ];
              const result = buildStockCopyLines(groups);
              assert.equal(
                  result,
                  '【abcdef】\n🔥 26年異色皮卡丘（現貨2隻）\n🔥 26年異色烈空坐\n\n【xyz789】\n🔥 26年異色夢幻\n\n【abcdef】\n🔥 26年異色超夢'
              );
              assert.doesNotMatch(result, /abcdef111111|abcdef222222|xyz789654321/);

              const handler = moduleScript.slice(
                  moduleScript.indexOf("document.getElementById('generateCopyBtn').addEventListener"),
                  moduleScript.indexOf("document.getElementById('closeCopyModalBtn')")
              );
              assert.match(handler, /account:\s*String\(p\.account \|\| ''\)/);
          });

          test('account-grouped prices follow displayed Pokemon lines rather than account sections', () => {
              const { getCopyPriceResult } = loadHelpers();
              const groups = [
                  { account: 'abcdef111111', label: '26年異色皮卡丘', quantity: 1 },
                  { account: 'xyz789654321', label: '26年異色夢幻', quantity: 1 },
                  { account: 'abcdef111111', label: '26年異色烈空坐', quantity: 1 }
              ];
              assert.equal(
                  getCopyPriceResult(groups, '150 300 200').text,
                  '【abcdef】\n🔥 26年異色皮卡丘｜1隻150元\n🔥 26年異色烈空坐｜1隻300元\n\n【xyz789】\n🔥 26年異色夢幻｜1隻200元'
              );
              assert.deepEqual(
                  { ...getCopyPriceResult(groups, '150 300') },
                  { ok: false, message: '需要 3 個價格，目前只有 2 個' }
              );
          });

          """
          path.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY

      - name: Verify tests fail before production change
        shell: bash
        run: |
          set +e
          node --test tests/inventory-color-and-stock-count.test.mjs > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the new regression tests to fail before implementation.'
            exit 1
          fi
          grep -Fq 'stock copy grouping key keeps full accounts separate' /tmp/red.log
          grep -Fq 'stock copy groups by full account' /tmp/red.log
          grep -Fq 'account-grouped prices follow displayed Pokemon lines' /tmp/red.log

      - name: Implement account-first stock copy grouping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start = text.index('        function getInventoryGroupingKey(item) {')
          end = text.index('\n\n        function getStockInventoryCount', start)
          new_key = r"""        function getInventoryGroupingKey(item) {
              return JSON.stringify([
                  String(item?.account || ''),
                  normalizeInventoryYear(item?.year),
                  normalizeColorType(item?.colorType),
                  normalizeBackCardType(item?.backCardType),
                  item?.name || ''
              ]);
          }"""
          text = text[:start] + new_key + text[end:]

          start = text.index('        function buildStockCopyLines(groups, prices = null) {')
          end = text.index('\n\n        function getCopyPriceResult', start)
          new_builder = r"""        function buildStockCopyLines(groups, prices = null) {
              if (!groups.length) return '目前無現貨寶可夢。';

              const hasAccountSections = groups.every(group =>
                  Object.prototype.hasOwnProperty.call(group, 'account')
              );

              if (!hasAccountSections) {
                  return groups.map(({ label, quantity }, index) => {
                      const stockLabel = quantity === 1 ? label : `${label}（現貨${quantity}隻）`;
                      const priceLabel = prices ? `｜1隻${prices[index]}元` : '';
                      return `🔥 ${stockLabel}${priceLabel}`;
                  }).join('\n');
              }

              const sections = new Map();
              groups.forEach(group => {
                  const account = String(group.account || '');
                  if (!sections.has(account)) sections.set(account, []);
                  sections.get(account).push(group);
              });

              let priceIndex = 0;
              return Array.from(sections, ([account, accountGroups]) => {
                  const lines = accountGroups.map(({ label, quantity }) => {
                      const stockLabel = quantity === 1 ? label : `${label}（現貨${quantity}隻）`;
                      const priceLabel = prices ? `｜1隻${prices[priceIndex]}元` : '';
                      priceIndex += 1;
                      return `🔥 ${stockLabel}${priceLabel}`;
                  });
                  return `【${account.slice(0, 6)}】\n${lines.join('\n')}`;
              }).join('\n\n');
          }"""
          text = text[:start] + new_builder + text[end:]

          old_group = "                const group = groups.get(key) || { label: formatInventoryCopyText(p), quantity: 0 };"
          new_group = "                const group = groups.get(key) || { account: String(p.account || ''), label: formatInventoryCopyText(p), quantity: 0 };"
          assert text.count(old_group) == 1, 'copy group creation changed'
          text = text.replace(old_group, new_group, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused and full tests
        shell: bash
        run: |
          node --test tests/inventory-color-and-stock-count.test.mjs
          node --test tests/*.test.mjs
          git diff --check

      - name: Verify scope and publish final commit
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'index.html\ntests/inventory-color-and-stock-count.test.mjs'

          if git diff -- index.html | grep -E 'lucky|schedule|tradeDate|Firestore'; then
            echo 'Unexpected lucky-trinket, scheduling, or Firestore change detected.'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-account-stock-copy.yml
          git add index.html tests/inventory-color-and-stock-count.test.mjs
          git diff --cached --check
          git commit -m 'feat: group stock copy by account'
          git push origin HEAD:codex/group-stock-copy-by-account
